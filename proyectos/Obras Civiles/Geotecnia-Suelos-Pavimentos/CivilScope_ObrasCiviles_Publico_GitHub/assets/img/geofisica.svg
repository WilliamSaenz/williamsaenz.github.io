  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Exploración indirecta / geofísica</text><path d="M80 300 C170 220 250 380 330 290 C430 170 520 400 620 270 C700 180 780 310 830 245" fill="none" stroke="#38bdf8" stroke-width="5"/><path d="M70 405 C170 360 260 430 360 375 C480 320 590 450 700 360 C770 310 820 340 850 320" fill="none" stroke="#c9a24d" stroke-width="5"/><rect x="80" y="100" width="180" height="90" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="170.0" y="132" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Sísmica / MASW</text>
<text x="170.0" y="160" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">velocidad de onda</text><rect x="330" y="100" width="180" height="90" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="420.0" y="132" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Resistividad</text>
<text x="420.0" y="160" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">agua, arcillas, cavidades</text><rect x="580" y="100" width="180" height="90" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="670.0" y="132" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">GPR</text>
<text x="670.0" y="160" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">servicios / anomalías someras</text><text x="90" y="500" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Uso práctico: cubre grandes áreas, pero se calibra con sondeos; una imagen bonita sin perforación es una novela.</text>
