<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Triaxial y círculos de Mohr">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Triaxial y círculos de Mohr</text><ellipse cx="205" cy="270" rx="65" ry="130" fill="#0b1f33" stroke="#38bdf8" stroke-width="3"/><rect x="165" y="160" width="80" height="220" rx="18" fill="#7c2d12" stroke="#c9a24d"/><line x1="205" y1="90" x2="205" y2="160" stroke="#f97316" stroke-width="6" marker-end="url(#arrow)"/><line x1="120" y1="270" x2="165" y2="270" stroke="#c9a24d" stroke-width="4"/><line x1="290" y1="270" x2="245" y2="270" stroke="#c9a24d" stroke-width="4"/><line x1="400" y1="445" x2="820" y2="445" stroke="#94a3b8"/><line x1="400" y1="125" x2="400" y2="445" stroke="#94a3b8"/><circle cx="500" cy="365" r="55" fill="none" stroke="#c9a24d" stroke-width="3"/><circle cx="610" cy="365" r="80" fill="none" stroke="#c9a24d" stroke-width="3"/><circle cx="735" cy="365" r="105" fill="none" stroke="#c9a24d" stroke-width="3"/><path d="M405 395 L805 160" stroke="#38bdf8" stroke-width="5"/><text x="660" y="175" fill="#fde68a" font-family="Arial, sans-serif" font-size="20" font-weight="800" text-anchor="start">c' + σ' tan φ'</text><text x="500" y="520" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">σ</text><text x="365" y="290" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">τ</text><text x="72" y="520" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Interpretación: UU = corto plazo; CU = transición con presión de poros; CD = largo plazo drenado.</text>
</svg>