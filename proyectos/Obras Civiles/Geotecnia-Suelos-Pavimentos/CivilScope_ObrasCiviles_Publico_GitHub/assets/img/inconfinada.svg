  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Compresión inconfinada</text><line x1="100" y1="430" x2="500" y2="430" stroke="#94a3b8"/><line x1="100" y1="110" x2="100" y2="430" stroke="#94a3b8"/><path d="M110 415 C180 330 260 210 350 195 C420 195 470 250 490 310" fill="none" stroke="#38bdf8" stroke-width="6"/><line x1="350" y1="195" x2="350" y2="430" stroke="#c9a24d" stroke-dasharray="10 8" stroke-width="3"/><line x1="100" y1="195" x2="350" y2="195" stroke="#c9a24d" stroke-dasharray="10 8" stroke-width="3"/><text x="360" y="190" fill="#fde68a" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start">qu</text><text x="210" y="480" fill="#dbeafe" font-family="Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start">deformación axial ε</text><text x="35" y="300" fill="#dbeafe" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">σ</text><rect x="620" y="150" width="95" height="220" rx="24" fill="#7c2d12" stroke="#c9a24d"/><line x1="620" y1="260" x2="715" y2="210" stroke="#38bdf8" stroke-width="4"/><text x="668" y="410" fill="#fde68a" font-family="Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle">Su ≈ qu/2</text><text x="80" y="530" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Uso práctico: lectura rápida de resistencia no drenada en arcillas cohesivas; no aplicar alegremente a arenas.</text>
