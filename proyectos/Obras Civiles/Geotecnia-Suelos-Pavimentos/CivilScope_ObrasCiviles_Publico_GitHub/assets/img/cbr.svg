<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Escala CBR">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">CBR y soporte de subrasante</text><rect x="90" y="180" width="150" height="100" fill="#ef4444" opacity=".85"/><text x="165.0" y="222" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle"><3</text><text x="165.0" y="255" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">muy débil</text><rect x="240" y="180" width="170" height="100" fill="#f97316" opacity=".85"/><text x="325.0" y="222" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle">3-8</text><text x="325.0" y="255" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">débil</text><rect x="410" y="180" width="190" height="100" fill="#c9a24d" opacity=".85"/><text x="505.0" y="222" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle">8-20</text><text x="505.0" y="255" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">regular</text><rect x="600" y="180" width="200" height="100" fill="#22c55e" opacity=".85"/><text x="700.0" y="222" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle">>20</text><text x="700.0" y="255" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">mejor soporte</text><line x1="90" y1="145" x2="800" y2="145" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="230" y="125" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">aumenta capacidad soporte relativa</text><text x="85" y="390" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Uso práctico: CBR bajo → revisar humedad, IP, compactación y drenaje antes de decidir espesores.</text><text x="85" y="440" fill="#fde68a" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Decisiones: estabilizar, reemplazar, mejorar drenaje, geosintético o aumentar paquete estructural.</text>
</svg>