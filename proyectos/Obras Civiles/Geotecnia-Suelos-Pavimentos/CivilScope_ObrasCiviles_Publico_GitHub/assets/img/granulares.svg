  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Materiales granulares</text><rect x="80" y="130" width="165" height="105" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
