<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Sistemas de contención">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Sistemas de contención y entibación</text><rect x="100" y="130" width="85" height="290" fill="#94a3b8"/><rect x="185" y="205" width="250" height="215" fill="#7c2d12" opacity=".8"/><line x1="185" y1="240" x2="430" y2="240" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/><line x1="185" y1="300" x2="430" y2="300" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/><rect x="520" y="150" width="85" height="270" fill="#c9a24d"/><line x1="605" y1="210" x2="780" y2="150" stroke="#38bdf8" stroke-width="5"/><line x1="605" y1="300" x2="780" y2="250" stroke="#38bdf8" stroke-width="5"/><text x="143" y="455" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">muro pantalla</text><text x="565" y="455" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">anclajes</text><text x="90" y="520" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Interpretación: no sólo resiste empujes; debe controlar deformaciones, agua, medianeras y secuencia constructiva.</text>
</svg>