<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Permeabilidad y Ley de Darcy">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Permeabilidad y Ley de Darcy</text><rect x="180" y="180" width="420" height="150" rx="18" fill="#7c2d12" opacity=".8" stroke="#c9a24d" stroke-width="2"/><circle cx="220" cy="220" r="13" fill="#0b1f33" stroke="#94a3b8"/><circle cx="270" cy="275" r="13" fill="#0b1f33" stroke="#94a3b8"/><circle cx="340" cy="230" r="13" fill="#0b1f33" stroke="#94a3b8"/><circle cx="410" cy="285" r="13" fill="#0b1f33" stroke="#94a3b8"/><circle cx="500" cy="230" r="13" fill="#0b1f33" stroke="#94a3b8"/><circle cx="555" cy="285" r="13" fill="#0b1f33" stroke="#94a3b8"/><line x1="70" y1="230" x2="165" y2="230" stroke="#38bdf8" stroke-width="6" marker-end="url(#arrow)"/><line x1="610" y1="255" x2="790" y2="255" stroke="#38bdf8" stroke-width="6" marker-end="url(#arrow)"/><text x="230" y="405" fill="#fde68a" font-family="Arial, sans-serif" font-size="34" font-weight="800" text-anchor="start">Q = k · i · A</text><text x="95" y="160" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">carga alta</text><text x="675" y="210" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">carga baja</text><text x="85" y="520" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Interpretación: k alto drena rápido; k bajo puede generar presión de poros, asentamientos lentos y excavaciones complicadas.</text>
</svg>