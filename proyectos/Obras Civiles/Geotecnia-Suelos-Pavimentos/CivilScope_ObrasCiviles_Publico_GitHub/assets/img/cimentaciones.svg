<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Tipos de cimentaciones">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Cimentaciones</text><rect x="90" y="390" width="720" height="55" fill="#7c2d12" opacity=".9"/><rect x="130" y="300" width="150" height="45" fill="#94a3b8"/><rect x="170" y="190" width="70" height="110" fill="#cbd5e1"/><rect x="380" y="270" width="180" height="55" fill="#94a3b8"/><rect x="425" y="170" width="90" height="100" fill="#cbd5e1"/><rect x="650" y="150" width="26" height="275" rx="10" fill="#38bdf8"/><rect x="700" y="150" width="26" height="275" rx="10" fill="#38bdf8"/><rect x="750" y="150" width="26" height="275" rx="10" fill="#38bdf8"/><text x="205" y="370" fill="#dbeafe" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">zapata</text><text x="470" y="350" fill="#dbeafe" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">platea</text><text x="705" y="455" fill="#dbeafe" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">pilotes</text><text x="85" y="525" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Selección: carga + perfil + asentamiento admisible + agua + constructibilidad. La solución barata mal elegida sale carísima.</text>
</svg>