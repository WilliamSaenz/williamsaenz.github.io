  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Curva granulométrica</text><line x1="90" y1="450" x2="820" y2="450" stroke="#94a3b8" stroke-width="2"/><line x1="90" y1="95" x2="90" y2="450" stroke="#94a3b8" stroke-width="2"/><line x1="220" y1="95" x2="220" y2="450" stroke="#203044"/><line x1="350" y1="95" x2="350" y2="450" stroke="#203044"/><line x1="480" y1="95" x2="480" y2="450" stroke="#203044"/><line x1="610" y1="95" x2="610" y2="450" stroke="#203044"/><line x1="740" y1="95" x2="740" y2="450" stroke="#203044"/><line x1="90" y1="380" x2="820" y2="380" stroke="#203044"/><line x1="90" y1="310" x2="820" y2="310" stroke="#203044"/><line x1="90" y1="240" x2="820" y2="240" stroke="#203044"/><line x1="90" y1="170" x2="820" y2="170" stroke="#203044"/><line x1="90" y1="100" x2="820" y2="100" stroke="#203044"/><path d="M100 430 C190 390 270 310 370 235 C500 135 640 105 805 85" fill="none" stroke="#38bdf8" stroke-width="6"/><path d="M100 430 C330 420 390 350 430 220 C475 105 625 87 805 82" fill="none" stroke="#c9a24d" stroke-width="5" stroke-dasharray="12 10"/><path d="M100 365 C230 360 380 350 530 315 C650 285 750 230 805 155" fill="none" stroke="#f97316" stroke-width="5"/><text x="330" y="505" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Tamaño de partícula / tamiz</text><text x="14" y="290" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">% que pasa</text><text x="160" y="120" fill="#38bdf8" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">bien graduado</text><text x="520" y="125" fill="#fde68a" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">uniforme</text><text x="600" y="315" fill="#fdba74" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">muchos finos</text><text x="90" y="535" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Uso práctico: base/subbase requiere curva controlada; exceso de finos = agua atrapada y pérdida de soporte.</text>
