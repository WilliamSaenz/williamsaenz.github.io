  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Densidad de campo</text><rect x="90" y="390" width="720" height="42" fill="#7c2d12" opacity=".9"/><circle cx="260" cy="390" r="65" fill="#07111f" stroke="#38bdf8" stroke-width="3"/><path d="M215 390 C230 470 290 470 305 390 Z" fill="#0b1f33" stroke="#38bdf8" stroke-width="3"/><rect x="190" y="250" width="145" height="35" fill="#c9a24d"/><path d="M215 250 L262 165 L310 250 Z" fill="#c9a24d" stroke="#fde68a" stroke-width="2"/><rect x="235" y="120" width="55" height="55" rx="8" fill="#dbeafe"/><line x1="262" y1="285" x2="262" y2="374" stroke="#fde68a" stroke-width="6" stroke-dasharray="10 8"/><rect x="440" y="120" width="320" height="60" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="600.0" y="152" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">1. extraer suelo</text><rect x="440" y="202" width="320" height="60" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="600.0" y="234" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">2. medir volumen</text><rect x="440" y="284" width="320" height="60" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="600.0" y="316" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">3. calcular γd</text><rect x="440" y="366" width="320" height="60" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="600.0" y="398" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">4. comparar con Proctor</text><text x="90" y="520" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Interpretación: si el grado de compactación no alcanza, no se tapa: se corrige humedad y se recompata.</text>
