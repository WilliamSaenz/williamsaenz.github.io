<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Instrumentación geotécnica">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Instrumentación y semáforo geotécnico</text><circle cx="200" cy="170" r="60" fill="#22c55e" opacity=".9"/><text x="200" y="255" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">verde: normal</text><circle cx="450" cy="170" r="60" fill="#eab308" opacity=".9"/><text x="450" y="255" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">amarillo: alerta</text><circle cx="700" cy="170" r="60" fill="#ef4444" opacity=".9"/><text x="700" y="255" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">rojo: detener y revisar</text><rect x="80" y="330" width="170" height="90" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="165.0" y="362" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Piezómetro</text>
<text x="165.0" y="390" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">u / NF</text><rect x="285" y="330" width="170" height="90" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="370.0" y="362" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Inclinómetro</text>
<text x="370.0" y="390" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">deformación lateral</text><rect x="490" y="330" width="170" height="90" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="575.0" y="362" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Prismas</text>
<text x="575.0" y="390" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">movimiento</text><rect x="695" y="330" width="170" height="90" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="780.0" y="362" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Placas</text>
<text x="780.0" y="390" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">asentamiento</text><text x="80" y="515" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">La instrumentación sirve cuando hay umbrales y reacción definida. Medir sin decidir es coleccionar sustos.</text>
</svg>