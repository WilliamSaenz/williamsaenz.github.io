<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Pavimento rígido">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Pavimento rígido</text><rect x="100" y="175" width="700" height="80" fill="#cbd5e1" stroke="#38bdf8" stroke-width="2"/><rect x="100" y="255" width="700" height="65" fill="#64748b"/><rect x="100" y="320" width="700" height="100" fill="#7c2d12"/><line x1="250" y1="175" x2="250" y2="255" stroke="#07111f" stroke-width="4"/><line x1="400" y1="175" x2="400" y2="255" stroke="#07111f" stroke-width="4"/><line x1="550" y1="175" x2="550" y2="255" stroke="#07111f" stroke-width="4"/><line x1="700" y1="175" x2="700" y2="255" stroke="#07111f" stroke-width="4"/><line x1="245" y1="215" x2="405" y2="215" stroke="#f97316" stroke-width="6"/><line x1="545" y1="215" x2="705" y2="215" stroke="#f97316" stroke-width="6"/><text x="450" y="155" fill="#fde68a" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">losa + juntas + transferencia de carga</text><text x="100" y="520" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Control: resistencia a flexión, curado, juntas y soporte uniforme. El hormigón también se queja, sólo que con fisuras.</text>
</svg>