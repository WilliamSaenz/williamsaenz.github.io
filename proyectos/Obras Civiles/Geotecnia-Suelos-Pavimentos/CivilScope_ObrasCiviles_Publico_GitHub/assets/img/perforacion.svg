<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Sistemas de perforación">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Sistemas de perforación</text><line x1="135" y1="145" x2="135" y2="375" stroke="#94a3b8" stroke-width="2"/><rect x="115" y="165" width="40" height="190" fill="#38bdf8" opacity=".75"/><rect x="60" y="390" width="150" height="90" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="135.0" y="422" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Auger</text>
<text x="135.0" y="450" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">suelos blandos / rápidos</text><line x1="300" y1="145" x2="300" y2="375" stroke="#94a3b8" stroke-width="2"/><rect x="280" y="165" width="40" height="190" fill="#38bdf8" opacity=".75"/><rect x="225" y="390" width="150" height="90" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="300.0" y="422" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Lavado</text>
<text x="300.0" y="450" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">avance con fluido</text><line x1="465" y1="145" x2="465" y2="375" stroke="#94a3b8" stroke-width="2"/><rect x="445" y="165" width="40" height="190" fill="#38bdf8" opacity=".75"/><rect x="390" y="390" width="150" height="90" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="465.0" y="422" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Rotativa</text>
<text x="465.0" y="450" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">suelo duro / roca blanda</text><line x1="630" y1="145" x2="630" y2="375" stroke="#94a3b8" stroke-width="2"/><rect x="610" y="165" width="40" height="190" fill="#38bdf8" opacity=".75"/><rect x="555" y="390" width="150" height="90" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="630.0" y="422" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Diamantina</text>
<text x="630.0" y="450" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">testigo de roca</text><line x1="795" y1="145" x2="795" y2="375" stroke="#94a3b8" stroke-width="2"/><rect x="775" y="165" width="40" height="190" fill="#38bdf8" opacity=".75"/><rect x="720" y="390" width="150" height="90" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="795.0" y="422" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Roto-percusión</text>
<text x="795.0" y="450" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">roca / bolones</text><text x="75" y="535" fill="#fca5a5" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Ojo: SPT no es perforación; es un ensayo in situ ejecutado dentro de una perforación.</text>
</svg>