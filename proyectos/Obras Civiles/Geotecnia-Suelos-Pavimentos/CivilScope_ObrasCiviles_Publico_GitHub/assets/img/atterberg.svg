<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Carta de plasticidad Atterberg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Carta de plasticidad</text><line x1="90" y1="450" x2="820" y2="450" stroke="#94a3b8" stroke-width="2"/><line x1="90" y1="90" x2="90" y2="450" stroke="#94a3b8" stroke-width="2"/><path d="M170 435 L765 135" stroke="#38bdf8" stroke-width="4" fill="none"/><path d="M330 450 L330 90" stroke="#c9a24d" stroke-width="3" stroke-dasharray="10 8"/><text x="505" y="170" fill="#38bdf8" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">A-linea: arcillas</text><text x="340" y="118" fill="#fde68a" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">LL = 50</text><text x="150" y="405" fill="#dbeafe" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">ML / OL</text><text x="470" y="405" fill="#dbeafe" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">MH / OH</text><text x="250" y="250" fill="#dbeafe" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">CL</text><text x="590" y="210" fill="#dbeafe" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">CH</text><text x="360" y="505" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Límite líquido LL</text><text x="18" y="285" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Índice plástico IP</text><circle cx="565" cy="205" r="9" fill="#ef4444"/><circle cx="255" cy="315" r="9" fill="#22c55e"/><text x="90" y="535" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Interpretación: IP alto + humedad alta = sensibilidad al agua, expansión/retracción y menor trabajabilidad.</text>
</svg>