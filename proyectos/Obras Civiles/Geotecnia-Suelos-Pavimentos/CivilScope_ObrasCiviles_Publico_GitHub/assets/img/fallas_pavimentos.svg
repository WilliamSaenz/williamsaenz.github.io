<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Fallas típicas de pavimentos">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Fallas típicas de pavimentos</text><rect x="70" y="130" width="165" height="100" rx="16" fill="#10233b" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
<text x="152.5" y="162" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Ahuellamiento</text>
<text x="152.5" y="190" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">deformación permanente</text><rect x="270" y="130" width="165" height="100" rx="16" fill="#10233b" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
<text x="352.5" y="162" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Fatiga</text>
<text x="352.5" y="190" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">piel de cocodrilo</text><rect x="470" y="130" width="165" height="100" rx="16" fill="#10233b" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
<text x="552.5" y="162" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Bache</text>
<text x="552.5" y="190" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">pérdida de material</text><rect x="670" y="130" width="165" height="100" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="752.5" y="162" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Bombeo</text>
<text x="752.5" y="190" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">agua + finos</text><rect x="80" y="300" width="730" height="90" fill="#111827"/><path d="M120 310 C180 355 240 295 300 345 C370 400 445 290 510 340 C580 390 650 295 755 350" fill="none" stroke="#ef4444" stroke-width="5"/><text x="90" y="520" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Diagnóstico real: mirar superficie, drenaje, tránsito, espesores, compactación y calidad de materiales; no culpar sólo al asfalto.</text>
</svg>