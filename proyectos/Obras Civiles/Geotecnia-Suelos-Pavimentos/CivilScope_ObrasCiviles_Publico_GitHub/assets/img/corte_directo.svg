<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Ensayo de corte directo">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Corte directo</text><rect x="120" y="230" width="290" height="90" fill="#7c2d12" stroke="#c9a24d" stroke-width="2"/><line x1="120" y1="275" x2="410" y2="275" stroke="#38bdf8" stroke-width="4"/><line x1="260" y1="145" x2="260" y2="225" stroke="#f97316" stroke-width="6" marker-end="url(#arrow)"/><line x1="410" y1="275" x2="540" y2="275" stroke="#38bdf8" stroke-width="6" marker-end="url(#arrow)"/><text x="235" y="135" fill="#fdba74" font-family="Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start">N</text><text x="550" y="282" fill="#38bdf8" font-family="Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start">T</text><line x1="120" y1="460" x2="780" y2="460" stroke="#94a3b8"/><line x1="120" y1="360" x2="120" y2="460" stroke="#94a3b8"/><path d="M125 445 L760 365" stroke="#38bdf8" stroke-width="5"/><text x="520" y="382" fill="#fde68a" font-family="Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start">τ = c + σ tan φ</text><text x="75" y="530" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Uso práctico: estima c y φ para deslizamiento en un plano; muy útil, pero el plano de falla es impuesto.</text>
</svg>