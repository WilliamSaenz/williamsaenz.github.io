<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Ensayo Marshall de mezcla asfáltica">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Mezcla asfáltica y Marshall</text><line x1="100" y1="430" x2="500" y2="430" stroke="#94a3b8"/><line x1="100" y1="120" x2="100" y2="430" stroke="#94a3b8"/><path d="M115 390 C190 280 300 190 390 205 C450 220 480 300 495 375" fill="none" stroke="#38bdf8" stroke-width="6"/><line x1="360" y1="205" x2="360" y2="430" stroke="#c9a24d" stroke-width="3" stroke-dasharray="10 8"/><text x="288" y="480" fill="#dbeafe" font-family="Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start">% asfalto</text><text x="35" y="300" fill="#dbeafe" font-family="Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start">estabilidad</text><rect x="585" y="120" width="230" height="80" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="700.0" y="152" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Estabilidad</text>
<text x="700.0" y="180" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">resistencia</text><rect x="585" y="225" width="230" height="80" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="700.0" y="257" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Flujo</text>
<text x="700.0" y="285" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">deformabilidad</text><rect x="585" y="330" width="230" height="80" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="700.0" y="362" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Vacíos</text>
<text x="700.0" y="390" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">durabilidad</text><text x="85" y="525" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Uso práctico: mezcla fría, mal compactada o con vacíos fuera de rango termina en fisuras, ahuellamiento o desprendimiento.</text>
</svg>