<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Capas de pavimento">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Estructura de pavimento flexible</text><rect x="100" y="120" width="690" height="60" fill="#111827" stroke="#c9a24d"/><text x="445" y="157.0" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Carpeta asfáltica</text><rect x="100" y="180" width="690" height="70" fill="#475569" stroke="#c9a24d"/><text x="445" y="222.0" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Base granular</text><rect x="100" y="250" width="690" height="75" fill="#64748b" stroke="#c9a24d"/><text x="445" y="294.5" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Subbase</text><rect x="100" y="325" width="690" height="95" fill="#7c2d12" stroke="#c9a24d"/><text x="445" y="379.5" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Subrasante compactada</text><line x1="740" y1="95" x2="740" y2="420" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><line x1="740" y1="420" x2="740" y2="95" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><text x="765" y="265" fill="#38bdf8" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">disipación de carga</text><text x="80" y="515" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">La subrasante mala no se tapa con asfalto: se mejora, drena o se redimensiona el paquete.</text>
</svg>