<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Clasificación visual manual de suelos">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Clasificación visual-manual</text><rect x="70" y="110" width="170" height="110" rx="16" fill="#164e63" stroke="#c9a24d" stroke-width="2" filter="url(#shadow)"/>
<text x="155.0" y="142" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Gravas</text>
<text x="155.0" y="170" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">drenan / soportan</text><rect x="275" y="110" width="170" height="110" rx="16" fill="#0f766e" stroke="#c9a24d" stroke-width="2" filter="url(#shadow)"/>
<text x="360.0" y="142" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Arenas</text>
<text x="360.0" y="170" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">fricción + densidad</text><rect x="480" y="110" width="170" height="110" rx="16" fill="#92400e" stroke="#c9a24d" stroke-width="2" filter="url(#shadow)"/>
<text x="565.0" y="142" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Limos</text>
<text x="565.0" y="170" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">sensibles al agua</text><rect x="685" y="110" width="170" height="110" rx="16" fill="#7f1d1d" stroke="#c9a24d" stroke-width="2" filter="url(#shadow)"/>
<text x="770.0" y="142" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Arcillas</text>
<text x="770.0" y="170" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">plasticidad + asentamiento</text><text x="70" y="285" fill="#fde68a" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">Ensayos rápidos en campo:</text><circle cx="110" cy="350" r="42" fill="#0b1f33" stroke="#38bdf8" stroke-width="2"/><text x="110" y="356" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">tacto</text><circle cx="260" cy="350" r="42" fill="#0b1f33" stroke="#38bdf8" stroke-width="2"/><text x="260" y="356" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">dilatancia</text><circle cx="410" cy="350" r="42" fill="#0b1f33" stroke="#38bdf8" stroke-width="2"/><text x="410" y="356" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">tenacidad</text><circle cx="560" cy="350" r="42" fill="#0b1f33" stroke="#38bdf8" stroke-width="2"/><text x="560" y="356" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">resistencia seca</text><circle cx="710" cy="350" r="42" fill="#0b1f33" stroke="#38bdf8" stroke-width="2"/><text x="710" y="356" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">olor/color</text><text x="70" y="455" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Interpretación: antes de pedir números, mirá si el suelo es granular, fino, orgánico, relleno o saturado.</text>
</svg>