<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Curva e log sigma de consolidación">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b2742"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="40" y="55" fill="#38bdf8" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Consolidación unidimensional</text><line x1="90" y1="430" x2="500" y2="430" stroke="#94a3b8" stroke-width="2"/><line x1="90" y1="100" x2="90" y2="430" stroke="#94a3b8" stroke-width="2"/><path d="M115 130 C210 155 275 210 330 290 C380 365 430 410 485 425" fill="none" stroke="#38bdf8" stroke-width="5"/><line x1="305" y1="100" x2="305" y2="430" stroke="#c9a24d" stroke-width="4" stroke-dasharray="10 8"/><text x="315" y="125" fill="#fde68a" font-family="Arial, sans-serif" font-size="20" font-weight="800" text-anchor="start">σ'p</text><text x="180" y="185" fill="#86efac" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">recompresión</text><text x="355" y="360" fill="#fca5a5" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">compresión virgen</text><text x="210" y="480" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">log σ'</text><text x="45" y="270" fill="#dbeafe" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">e</text><rect x="560" y="115" width="280" height="80" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="700.0" y="147" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Cc</text>
<text x="700.0" y="175" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">magnitud de asentamiento</text><rect x="560" y="220" width="280" height="80" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="700.0" y="252" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Cv</text>
<text x="700.0" y="280" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">velocidad / tiempo</text><rect x="560" y="325" width="280" height="80" rx="16" fill="#10233b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
<text x="700.0" y="357" fill="#fde68a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">OCR</text>
<text x="700.0" y="385" fill="#dbeafe" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">historia de carga</text><text x="70" y="530" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Uso práctico: define cuánto y cuándo asentará una arcilla bajo zapatas, plateas, terraplenes o rellenos.</text>
</svg>