<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Métodos de densidad de campo"><defs><style>.bg{fill:#06172a}.panel{fill:#0b2034;stroke:#38bdf8;stroke-width:2}.line{stroke:#38bdf8;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.gold{stroke:#f7d154;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#22c55e;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.red{stroke:#fb7185;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.txt{fill:#f4f7fb;font-family:Arial, sans-serif;font-size:22px;font-weight:700}.small{fill:#c8d7ec;font-family:Arial, sans-serif;font-size:16px}.tiny{fill:#dff4ff;font-family:Arial, sans-serif;font-size:13px;font-weight:700}.yellow{fill:#f7d154}.cyan{fill:#38bdf8}.muted{fill:#9fb4cd}.white{fill:#fff}.grid{stroke:#294258;stroke-width:1}.arrow{marker-end:url(#arr)} </style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker></defs><rect class="bg" width="900" height="520" rx="24"/>
<text x="36" y="48" class="txt">Densidad de campo: confirmar en obra el Proctor logrado</text>
<g transform="translate(40,98)">
<rect x="0" y="0" width="200" height="280" rx="16" class="panel"/><text x="24" y="34" class="tiny">Cono de arena</text>
<rect x="80" y="55" width="40" height="45" fill="#17324a" stroke="#38bdf8" stroke-width="3"/>
<path d="M78,100 L122,100 L100,130 Z" fill="#f7d154"/>
<circle cx="96" cy="138" r="2" fill="#f7d154"/><circle cx="104" cy="142" r="2" fill="#f7d154"/><circle cx="100" cy="148" r="2" fill="#f7d154"/>
<circle cx="100" cy="172" r="22" fill="none" stroke="#fb7185" stroke-width="4"/>
<text x="34" y="250" class="small">económico, manual</text>
<rect x="230" y="0" width="200" height="280" rx="16" class="panel"/><text x="254" y="34" class="tiny">Densímetro nuclear</text>
<line x1="330" y1="55" x2="330" y2="150" stroke="#38bdf8" stroke-width="8"/>
<line x1="270" y1="100" x2="390" y2="100" stroke="#fff" stroke-width="2"/>
<path d="M300,130 A30,30 0 0,1 360,130" fill="none" stroke="#f7d154" stroke-width="3"/>
<path d="M285,140 A45,45 0 0,1 375,140" fill="none" stroke="#f7d154" stroke-width="2" opacity="0.6"/>
<text x="264" y="250" class="small">rápido, normado</text>
<rect x="460" y="0" width="200" height="280" rx="16" class="panel"/><text x="484" y="34" class="tiny">Membrana de hule</text>
<path d="M530,55 C510,75 510,115 535,135 C560,155 590,145 595,115 C600,85 570,55 530,55 Z" fill="none" stroke="#38bdf8" stroke-width="4"/>
<path d="M535,70 C520,85 525,110 545,120 C565,130 580,110 575,90 C570,73 550,65 535,70 Z" fill="#17324a" stroke="#fb7185" stroke-width="2" stroke-dasharray="4 4"/>
<text x="478" y="250" class="small">preciso en gravas</text>
</g>
<rect x="724" y="98" width="130" height="250" rx="14" fill="#0b2034" stroke="#294258"/>
<text x="742" y="130" class="tiny">Pregunta clave</text>
<text x="742" y="162" class="tiny">¿el material</text><text x="742" y="186" class="tiny">es uniforme,</text><text x="742" y="210" class="tiny">sin gravas</text><text x="742" y="234" class="tiny">gruesas?</text>
<text x="742" y="268" class="tiny">Con gravas:</text><text x="742" y="292" class="tiny">el cono pierde</text><text x="742" y="316" class="tiny">precisión.</text>
<rect x="40" y="398" width="814" height="50" rx="12" fill="#0b2034" stroke="#294258"/>
<text x="60" y="428" class="small">El método se elige por tipo de suelo, profundidad y velocidad de control requerida en obra.</text>
</svg>
