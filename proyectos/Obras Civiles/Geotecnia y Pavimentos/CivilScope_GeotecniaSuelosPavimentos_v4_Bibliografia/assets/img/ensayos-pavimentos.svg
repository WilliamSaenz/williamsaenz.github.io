<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Ensayos principales de pavimentos"><defs><style>.bg{fill:#06172a}.panel{fill:#0b2034;stroke:#38bdf8;stroke-width:2}.line{stroke:#38bdf8;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.gold{stroke:#f7d154;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#22c55e;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.red{stroke:#fb7185;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.txt{fill:#f4f7fb;font-family:Arial, sans-serif;font-size:22px;font-weight:700}.small{fill:#c8d7ec;font-family:Arial, sans-serif;font-size:16px}.tiny{fill:#dff4ff;font-family:Arial, sans-serif;font-size:13px;font-weight:700}.yellow{fill:#f7d154}.cyan{fill:#38bdf8}.muted{fill:#9fb4cd}.white{fill:#fff}.grid{stroke:#294258;stroke-width:1}.arrow{marker-end:url(#arr)} </style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker></defs><rect class="bg" width="900" height="520" rx="24"/>
<text x="36" y="48" class="txt">Ensayos de pavimentos: cada resultado debe disparar una decisión</text>
<g transform="translate(45,95)">
<rect x="0" y="0" width="185" height="105" rx="16" class="panel"/><text x="24" y="35" class="tiny">CBR / DCP</text><text x="24" y="67" class="small">soporte</text><text x="24" y="92" class="small">subrasante</text>
<rect x="205" y="0" width="185" height="105" rx="16" class="panel"/><text x="229" y="35" class="tiny">Proctor + densidad</text><text x="229" y="67" class="small">aceptar o</text><text x="229" y="92" class="small">recompactar</text>
<rect x="410" y="0" width="185" height="105" rx="16" class="panel"/><text x="434" y="35" class="tiny">Granulometría</text><text x="434" y="67" class="small">drenaje y</text><text x="434" y="92" class="small">segregación</text>
<rect x="615" y="0" width="185" height="105" rx="16" class="panel"/><text x="639" y="35" class="tiny">Atterberg</text><text x="639" y="67" class="small">plasticidad</text><text x="639" y="92" class="small">y agua</text>
<rect x="100" y="160" width="185" height="105" rx="16" class="panel"/><text x="124" y="195" class="tiny">Los Ángeles</text><text x="124" y="227" class="small">durabilidad</text><text x="124" y="252" class="small">agregado</text>
<rect x="305" y="160" width="185" height="105" rx="16" class="panel"/><text x="329" y="195" class="tiny">Marshall / Rice</text><text x="329" y="227" class="small">mezcla</text><text x="329" y="252" class="small">asfáltica</text>
<rect x="510" y="160" width="185" height="105" rx="16" class="panel"/><text x="534" y="195" class="tiny">FWD / IRI</text><text x="534" y="227" class="small">estructura y</text><text x="534" y="252" class="small">servicio</text>
</g>
<text x="90" y="450" class="small">Cruce mínimo: CBR + IP + humedad + compactación + drenaje. Un número aislado no aprueba una capa.</text>
</svg>