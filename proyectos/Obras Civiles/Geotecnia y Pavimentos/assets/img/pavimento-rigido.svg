<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Estructura de pavimento rígido"><defs><style>.bg{fill:#06172a}.panel{fill:#0b2034;stroke:#38bdf8;stroke-width:2}.line{stroke:#38bdf8;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.gold{stroke:#f7d154;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#22c55e;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.red{stroke:#fb7185;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.txt{fill:#f4f7fb;font-family:Arial, sans-serif;font-size:22px;font-weight:700}.small{fill:#c8d7ec;font-family:Arial, sans-serif;font-size:16px}.tiny{fill:#dff4ff;font-family:Arial, sans-serif;font-size:13px;font-weight:700}.yellow{fill:#f7d154}.cyan{fill:#38bdf8}.muted{fill:#9fb4cd}.white{fill:#fff}.grid{stroke:#294258;stroke-width:1}.arrow{marker-end:url(#arr)} </style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker></defs><rect class="bg" width="900" height="520" rx="24"/>
<text x="36" y="40" class="txt">Pavimento rígido: la losa trabaja como placa,</text>
<text x="36" y="66" class="txt">no se deforma capa por capa</text>
<rect x="80" y="104" width="720" height="270" rx="18" class="panel"/>
<text x="395" y="130" class="tiny">junta + pasador</text>
<rect x="150" y="140" width="600" height="70" fill="#c9c9c9" stroke="#fff"/><text x="175" y="180" class="tiny" style="fill:#0b1320">Losa de hormigón: flexión, juntas, pasadores, curado</text>
<rect x="150" y="210" width="600" height="60" fill="#7c6a50" stroke="#fff"/><text x="175" y="245" class="tiny">Base: soporte uniforme bajo la losa, evita bombeo</text>
<rect x="150" y="270" width="600" height="54" fill="#60452e" stroke="#fff"/><text x="175" y="302" class="tiny">Subrasante: CBR, uniformidad, drenaje</text>
<line x1="450" y1="140" x2="450" y2="210" stroke="#fb7185" stroke-width="3" stroke-dasharray="6 6"/>
<rect x="435" y="168" width="30" height="8" fill="#dff4ff" rx="2"/>
<path d="M85,400 C220,370 340,390 470,376 C610,358 720,384 835,355" class="line"/>
<text x="90" y="438" class="small">Regla: la losa reparte carga por flexión; la junta libera tensión y corta diferencial.</text>
</svg>
