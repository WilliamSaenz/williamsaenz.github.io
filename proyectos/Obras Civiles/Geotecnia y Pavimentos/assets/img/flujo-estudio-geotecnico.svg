<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Flujo de estudio geotécnico"><defs><style>.bg{fill:#06172a}.panel{fill:#0b2034;stroke:#38bdf8;stroke-width:2}.line{stroke:#38bdf8;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.gold{stroke:#f7d154;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#22c55e;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.red{stroke:#fb7185;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.txt{fill:#f4f7fb;font-family:Arial, sans-serif;font-size:22px;font-weight:700}.small{fill:#c8d7ec;font-family:Arial, sans-serif;font-size:16px}.tiny{fill:#dff4ff;font-family:Arial, sans-serif;font-size:13px;font-weight:700}.yellow{fill:#f7d154}.cyan{fill:#38bdf8}.muted{fill:#9fb4cd}.white{fill:#fff}.grid{stroke:#294258;stroke-width:1}.arrow{marker-end:url(#arr)} </style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker></defs><rect class="bg" width="900" height="520" rx="24"/>
<text x="36" y="48" class="txt">Modelo geotécnico: del dato aislado a la decisión de diseño</text>
<g transform="translate(35,100)">
<rect x="0" y="0" width="150" height="72" rx="14" class="panel"/><text x="22" y="31" class="tiny">Información previa</text><text x="22" y="54" class="small">geología · obra</text>
<path d="M150,36 L198,36" class="line arrow"/>
<rect x="205" y="0" width="150" height="72" rx="14" class="panel"/><text x="248" y="31" class="tiny">Campo</text><text x="230" y="54" class="small">sondeos · NF</text>
<path d="M355,36 L403,36" class="line arrow"/>
<rect x="410" y="0" width="150" height="72" rx="14" class="panel"/><text x="434" y="31" class="tiny">Laboratorio</text><text x="424" y="54" class="small">índices · resistencia</text>
<path d="M560,36 L608,36" class="line arrow"/>
<rect x="615" y="0" width="220" height="72" rx="14" class="panel"/><text x="646" y="31" class="tiny">Modelo geotécnico</text><text x="650" y="54" class="small">perfil · parámetros · riesgos</text>
</g>
<rect x="85" y="230" width="725" height="170" rx="18" fill="#0b2034" stroke="#294258"/>
<text x="110" y="266" class="small">Criterio senior: la investigación no se diseña por cantidad de perforaciones “de memoria”.</text>
<text x="110" y="304" class="small">Se diseña por riesgo, variabilidad estratigráfica, carga, excavación, agua y consecuencia de falla.</text>
<text x="110" y="346" class="yellow" font-family="Arial" font-weight="900" font-size="18">Producto final: perfil estratigráfico + nivel freático + parámetros + recomendaciones + límites de validez.</text>
</svg>