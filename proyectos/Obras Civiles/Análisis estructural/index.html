<!DOCTYPE html>
<html lang="es" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StructuralScope Pro | Análisis estructural</title>

  <style>
    :root{
      --bg:#07111f;
      --bg2:#0b1f33;
      --panel:#101d2f;
      --panel2:#07111f;
      --text:#f8fafc;
      --body:#eef6ff;
      --muted:#c3d0e2;
      --blue:#38bdf8;
      --gold:#d6ad4f;
      --green:#39ff14;
      --red:#fb7185;
      --orange:#f97316;
      --ok:#22c55e;
      --line:rgba(255,255,255,.16);
      --lineBlue:rgba(56,189,248,.38);
      --shadow:0 24px 64px rgba(0,0,0,.38);
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      min-height:100vh;
      overflow-x:hidden;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 9% 10%, rgba(56,189,248,.17), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(214,173,79,.13), transparent 25%),
        linear-gradient(135deg,var(--bg),var(--bg2));
    }

    a{color:inherit;text-decoration:none}

    .topbar{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(7,17,31,.96);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line);
      box-shadow:0 14px 34px rgba(0,0,0,.30);
    }

    .top-inner{
      width:min(1540px,92vw);
      margin:0 auto;
      padding:20px 0 16px;
      display:grid;
      grid-template-columns:1fr auto;
      gap:22px;
      align-items:center;
    }

    .terminal{
      color:var(--green);
      font-family:"Courier New", monospace;
      font-size:15px;
      font-weight:900;
      margin-bottom:8px;
    }

    .brand h1{
      margin:0;
      font-size:clamp(34px,3.2vw,58px);
      line-height:1.02;
      letter-spacing:-1.6px;
    }

    .brand p{
      margin:10px 0 0;
      color:#dbeafe;
      font-size:18px;
      font-weight:800;
    }

    .brand .gold{color:var(--gold)}

    .top-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      padding:10px 15px;
      border-radius:13px;
      border:2px solid var(--blue);
      background:rgba(7,17,31,.38);
      color:var(--text);
      font-weight:900;
      font-size:14px;
      transition:.22s ease;
      cursor:pointer;
    }

    .btn:hover{
      transform:translateY(-2px);
      background:var(--blue);
      color:var(--bg);
      box-shadow:0 12px 25px rgba(56,189,248,.18);
    }

    .btn.gold{
      border-color:var(--gold);
      color:var(--gold);
    }

    .btn.gold:hover{
      background:var(--gold);
      color:var(--bg);
      box-shadow:0 12px 25px rgba(214,173,79,.20);
    }

    .main-nav{
      width:min(1540px,92vw);
      margin:0 auto;
      padding:0 0 18px;
      display:flex;
      gap:10px;
      overflow-x:auto;
    }

    .main-nav button{
      white-space:nowrap;
      border:2px solid var(--lineBlue);
      background:rgba(7,17,31,.45);
      color:var(--text);
      padding:11px 15px;
      min-height:44px;
      border-radius:14px;
      cursor:pointer;
      font-size:14px;
      font-weight:900;
      transition:.22s ease;
    }

    .main-nav button:hover{
      background:var(--blue);
      color:var(--bg);
      transform:translateY(-2px);
    }

    .main-nav button.active{
      border-color:var(--gold);
      background:var(--gold);
      color:var(--bg);
    }

    .layout{
      width:min(1540px,92vw);
      margin:34px auto 54px;
      display:grid;
      grid-template-columns:340px minmax(0,1fr);
      gap:34px;
      align-items:start;
    }

    .sidebar{
      position:sticky;
      top:170px;
      max-height:calc(100vh - 190px);
      overflow:auto;
      background:rgba(16,29,47,.94);
      border:1px solid var(--line);
      border-radius:28px;
      padding:26px;
      box-shadow:var(--shadow);
    }

    .side-title{
      display:flex;
      gap:14px;
      align-items:center;
      border-bottom:1px solid var(--line);
      padding-bottom:18px;
      margin-bottom:18px;
    }

    .dot{
      width:14px;
      height:14px;
      border-radius:50%;
      background:var(--blue);
      box-shadow:0 0 0 6px rgba(56,189,248,.13);
      flex:none;
    }

    .side-title h2{
      margin:0;
      color:var(--blue);
      font-size:22px;
      line-height:1.1;
    }

    .side-title span{
      display:block;
      color:var(--muted);
      margin-top:5px;
      font-size:14px;
      font-weight:800;
    }

    .side-menu{
      display:grid;
      gap:10px;
    }

    .side-menu button{
      width:100%;
      text-align:left;
      border:1px solid rgba(56,189,248,.25);
      background:rgba(7,17,31,.58);
      color:#dbeafe;
      padding:14px;
      border-radius:15px;
      cursor:pointer;
      font-size:15px;
      font-weight:900;
      transition:.22s ease;
    }

    .side-menu button:hover{
      border-color:var(--blue);
      transform:translateX(3px);
    }

    .side-menu button.active{
      color:#ffe8a3;
      background:linear-gradient(90deg,rgba(214,173,79,.27),rgba(56,189,248,.10));
      border-color:rgba(214,173,79,.90);
      box-shadow:inset 6px 0 0 var(--gold), 0 12px 24px rgba(214,173,79,.08);
    }

    .content{
      min-width:0;
    }

    .hero,.section{
      background:rgba(16,29,47,.94);
      border:1px solid var(--line);
      border-radius:28px;
      padding:34px;
      box-shadow:var(--shadow);
      margin-bottom:28px;
    }

    .hero{
      background:
        radial-gradient(circle at top right, rgba(56,189,248,.14), transparent 40%),
        rgba(16,29,47,.94);
    }

    .label{
      color:var(--green);
      font-family:"Courier New", monospace;
      font-weight:900;
      font-size:15px;
      margin-bottom:10px;
    }

    .hero h2{
      margin:0 0 16px;
      color:var(--blue);
      font-size:clamp(34px,3vw,56px);
      line-height:1.08;
      letter-spacing:-1.1px;
      padding-bottom:18px;
      border-bottom:1px solid var(--line);
    }

    .hero p,.section p,.section li{
      color:var(--body);
      font-size:18px;
      line-height:1.62;
      font-weight:750;
    }

    .section h2{
      margin:0 0 18px;
      color:var(--blue);
      font-size:clamp(30px,2.4vw,46px);
      line-height:1.1;
      letter-spacing:-.8px;
      padding-bottom:16px;
      border-bottom:1px solid var(--line);
    }

    .section h3{
      margin:20px 0 10px;
      color:var(--gold);
      font-size:24px;
      line-height:1.15;
    }

    .searchbar{
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      margin-top:24px;
    }

    .searchbar input{
      width:100%;
      min-height:52px;
      border:1px solid var(--lineBlue);
      border-radius:15px;
      background:rgba(7,17,31,.85);
      color:var(--text);
      padding:15px 16px;
      font-size:16px;
      font-weight:800;
      outline:none;
    }

    .searchbar input:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 4px rgba(56,189,248,.13);
    }

    .searchbar button{
      min-height:52px;
      padding:12px 20px;
      border-radius:15px;
      border:2px solid var(--gold);
      background:transparent;
      color:var(--gold);
      font-weight:900;
      cursor:pointer;
      transition:.22s ease;
    }

    .searchbar button:hover{
      background:var(--gold);
      color:var(--bg);
      transform:translateY(-2px);
    }

    .quick-tools{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      border-top:1px solid var(--line);
      margin-top:20px;
      padding-top:20px;
    }

    .quick-tools button{
      border:1px solid rgba(56,189,248,.45);
      background:rgba(56,189,248,.10);
      color:var(--text);
      border-radius:999px;
      padding:10px 13px;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      transition:.22s ease;
    }

    .quick-tools button:hover{
      background:var(--blue);
      color:var(--bg);
      transform:translateY(-2px);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:20px;
      margin-top:22px;
    }

    .grid.two{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .card{
      background:rgba(7,17,31,.62);
      border:1px solid var(--line);
      border-radius:20px;
      padding:24px;
      box-shadow:0 10px 22px rgba(0,0,0,.18);
      transition:.22s ease;
    }

    .card:hover{
      border-color:rgba(56,189,248,.50);
      transform:translateY(-4px);
      box-shadow:0 18px 38px rgba(56,189,248,.10);
    }

    .card h3{
      margin:0 0 10px;
      color:var(--gold);
      font-size:22px;
    }

    .card p{
      margin:0;
      color:#dbeafe;
      font-size:16px;
      line-height:1.55;
    }

    .pill-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:15px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      background:rgba(56,189,248,.13);
      color:var(--text);
      border:1px solid rgba(56,189,248,.42);
      padding:8px 11px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
    }

    .box{
      border-radius:18px;
      padding:18px 20px;
      margin:18px 0;
      font-size:17px;
      font-weight:800;
    }

    .info{
      border:1px solid rgba(56,189,248,.35);
      border-left:6px solid var(--blue);
      background:rgba(56,189,248,.09);
      color:#dbeafe;
    }

    .warn{
      border:1px solid rgba(249,115,22,.38);
      border-left:6px solid var(--orange);
      background:rgba(249,115,22,.09);
      color:#fed7aa;
    }

    .senior{
      border:1px solid rgba(214,173,79,.43);
      background:rgba(214,173,79,.09);
      color:#fff6d8;
    }

    table{
      width:100%;
      border-collapse:collapse;
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      margin:18px 0;
      background:rgba(7,17,31,.62);
    }

    th,td{
      padding:15px;
      border-bottom:1px solid rgba(255,255,255,.09);
      text-align:left;
      vertical-align:top;
      color:#dbeafe;
      font-weight:750;
      font-size:15px;
    }

    th{
      background:rgba(56,189,248,.13);
      color:var(--text);
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.04em;
      font-weight:900;
    }

    tr:last-child td{border-bottom:none}

    td.value{
      color:var(--gold);
      font-weight:900;
      white-space:nowrap;
    }

    details{
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(7,17,31,.62);
      margin:12px 0;
      overflow:hidden;
    }

    summary{
      cursor:pointer;
      padding:16px 18px;
      font-weight:900;
      color:var(--gold);
      background:rgba(56,189,248,.08);
      font-size:16px;
    }

    details[open] summary{
      border-bottom:1px solid var(--line);
      background:rgba(56,189,248,.13);
    }

    .details-body{
      padding:18px;
      color:var(--body);
    }

    .flow{
      display:grid;
      gap:12px;
      margin-top:18px;
    }

    .flow-step{
      display:grid;
      grid-template-columns:56px 1fr;
      gap:16px;
      align-items:center;
      background:rgba(7,17,31,.62);
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
    }

    .num{
      width:48px;
      height:48px;
      border-radius:15px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#004aad,#0b2b61);
      color:white;
      font-weight:900;
      font-size:20px;
      border:1px solid rgba(56,189,248,.35);
    }

    .diagram{
      background:
        radial-gradient(circle at 18% 12%, rgba(56,189,248,.10), transparent 28%),
        rgba(7,17,31,.64);
      border:1px solid rgba(56,189,248,.32);
      border-radius:22px;
      padding:18px;
      margin:18px 0;
      box-shadow:0 14px 30px rgba(0,0,0,.18);
    }

    .diagram-title{
      color:var(--gold);
      font-weight:900;
      font-size:18px;
      margin-bottom:12px;
    }

    .diagram svg{
      width:100%;
      height:auto;
      display:block;
      background:rgba(255,255,255,.03);
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
    }

    .diagram-note{
      color:#cfe5ff;
      font-size:15px;
      font-weight:800;
      margin-top:12px;
    }

    .calc-box{
      background:rgba(7,17,31,.65);
      border:1px solid rgba(214,173,79,.35);
      border-radius:20px;
      padding:20px;
      margin:18px 0;
    }

    .calc-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
    }

    .calc-box label{
      color:#dbeafe;
      font-weight:900;
      font-size:14px;
      display:block;
      margin-bottom:6px;
    }

    .calc-box input,.calc-box select{
      width:100%;
      min-height:46px;
      background:#07111f;
      color:var(--text);
      border:1px solid rgba(56,189,248,.40);
      border-radius:13px;
      padding:10px 12px;
      font-weight:800;
    }

    .calc-result{
      margin-top:16px;
      padding:16px;
      border-radius:16px;
      background:rgba(56,189,248,.10);
      border:1px solid rgba(56,189,248,.32);
      color:#eaf6ff;
      font-weight:800;
    }

    .source-list a{
      color:var(--blue);
      font-weight:900;
    }

    .source-list a:hover{
      color:var(--gold);
      text-decoration:underline;
    }

    .search-results{
      display:none;
    }

    @media(max-width:1180px){
      .top-inner{
        grid-template-columns:1fr;
      }

      .top-actions{
        justify-content:flex-start;
      }

      .layout{
        grid-template-columns:1fr;
        width:min(100% - 32px,1000px);
      }

      .sidebar{
        position:relative;
        top:auto;
        max-height:none;
      }

      .side-menu{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      .grid,.grid.two,.calc-grid{
        grid-template-columns:1fr;
      }

      .searchbar{
        grid-template-columns:1fr;
      }

      .main-nav{
        width:min(100% - 32px,1000px);
      }
    }

    @media(max-width:680px){
      .brand h1{font-size:32px}
      .brand p{font-size:16px}

      .hero,.section,.sidebar{
        padding:22px;
        border-radius:22px;
      }

      .side-menu{
        grid-template-columns:1fr;
      }

      .hero h2{font-size:30px}
      .section h2{font-size:28px}

      th,td{
        padding:10px;
        font-size:13px;
      }

      .flow-step{
        grid-template-columns:1fr;
      }

      .btn,.main-nav button{
        font-size:13px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="top-inner">
      <div class="brand">
        <div class="terminal">> guía 04 estructuras... sistema listo</div>
        <h1>StructuralScope Pro</h1>
        <p>Demo interactivo de <span class="gold">análisis estructural, hormigón/concreto y acero</span></p>
      </div>

      <div class="top-actions">
        <a class="btn gold" href="../">← Volver a Obras Civiles</a>
        <a class="btn" href="../../">Proyectos</a>
        <a class="btn" href="../../../">Portafolio</a>
      </div>
    </div>

    <nav class="main-nav" id="mainNav" aria-label="Módulos principales"></nav>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="side-title">
        <span class="dot"></span>
        <div>
          <h2 id="sideTitle">Inicio</h2>
          <span id="sideSubtitle">Mapa de consulta</span>
        </div>
      </div>
      <div class="side-menu" id="sideMenu"></div>
    </aside>

    <section class="content">
      <div class="hero" id="hero"></div>
      <div id="content"></div>
    </section>
  </main>

  <script>
    const diagrams = {
      loads: `
        <div class="diagram">
          <div class="diagram-title">Camino de cargas: de la losa al suelo</div>
          <svg viewBox="0 0 1000 360" role="img" aria-label="Camino de cargas en una estructura">
            <defs><marker id="arrowLoad" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d6ad4f"></path></marker></defs>
            <rect x="100" y="55" width="800" height="38" fill="#38bdf8" opacity=".28" stroke="#38bdf8"/>
            <rect x="160" y="120" width="680" height="34" fill="#d6ad4f" opacity=".24" stroke="#d6ad4f"/>
            <rect x="230" y="185" width="70" height="105" fill="#0d1b2d" stroke="#38bdf8" stroke-width="3"/>
            <rect x="700" y="185" width="70" height="105" fill="#0d1b2d" stroke="#38bdf8" stroke-width="3"/>
            <rect x="170" y="290" width="190" height="42" fill="#102033" stroke="#d6ad4f" stroke-width="3"/>
            <rect x="640" y="290" width="190" height="42" fill="#102033" stroke="#d6ad4f" stroke-width="3"/>
            <text x="500" y="35" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="900">Camino de cargas verticales</text>
            <text x="500" y="80" text-anchor="middle" fill="#eef6ff" font-size="17" font-weight="700">Losa</text>
            <text x="500" y="143" text-anchor="middle" fill="#eef6ff" font-size="17" font-weight="700">Viga</text>
            <text x="265" y="245" text-anchor="middle" fill="#eef6ff" font-size="17" font-weight="700">Columna</text>
            <text x="735" y="245" text-anchor="middle" fill="#eef6ff" font-size="17" font-weight="700">Columna</text>
            <text x="265" y="318" text-anchor="middle" fill="#eef6ff" font-size="17" font-weight="700">Fundación</text>
            <text x="735" y="318" text-anchor="middle" fill="#eef6ff" font-size="17" font-weight="700">Fundación</text>
            <line x1="500" y1="95" x2="500" y2="118" stroke="#d6ad4f" stroke-width="5" marker-end="url(#arrowLoad)"/>
            <line x1="500" y1="155" x2="265" y2="185" stroke="#d6ad4f" stroke-width="5" marker-end="url(#arrowLoad)"/>
            <line x1="500" y1="155" x2="735" y2="185" stroke="#d6ad4f" stroke-width="5" marker-end="url(#arrowLoad)"/>
          </svg>
          <div class="diagram-note">Si no podés explicar por dónde viaja la carga, el modelo está incompleto o mal conceptualizado.</div>
        </div>
      `,
      slabs: `
        <div class="diagram">
          <div class="diagram-title">Losa en una dirección vs losa en dos direcciones</div>
          <svg viewBox="0 0 980 360" role="img" aria-label="Comparación de losas en una dirección y dos direcciones">
            <defs>
              <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"></path></marker>
              <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d6ad4f"></path></marker>
            </defs>
            <rect x="30" y="45" width="390" height="210" rx="18" fill="#0d1b2d" stroke="#38bdf8" stroke-width="3"/>
            <rect x="65" y="80" width="320" height="140" fill="rgba(56,189,248,.12)" stroke="#c3d0e2" stroke-width="2"/>
            <line x1="70" y1="150" x2="380" y2="150" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrowBlue)"/>
            <line x1="70" y1="180" x2="380" y2="180" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrowBlue)"/>
            <text x="225" y="30" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800">1 dirección</text>
            <text x="225" y="285" text-anchor="middle" fill="#d6ad4f" font-size="18" font-weight="800">Largo / corto ≥ 2</text>
            <rect x="560" y="45" width="390" height="210" rx="18" fill="#0d1b2d" stroke="#d6ad4f" stroke-width="3"/>
            <rect x="595" y="80" width="320" height="140" fill="rgba(214,173,79,.12)" stroke="#c3d0e2" stroke-width="2"/>

    let currentModule = "inicio";
    let currentSection = "vision";

    const mainNav = document.getElementById("mainNav");
    const sideTitle = document.getElementById("sideTitle");
    const sideSubtitle = document.getElementById("sideSubtitle");
    const sideMenu = document.getElementById("sideMenu");
    const hero = document.getElementById("hero");
    const content = document.getElementById("content");

    function renderMainNav(){
      mainNav.innerHTML = Object.entries(modules).map(([key,m]) =>
        `<button class="${key===currentModule?'active':''}" data-module="${key}">${m.label}</button>`
      ).join("");

      mainNav.querySelectorAll("button").forEach(btn=>{
        btn.addEventListener("click",()=>{
          currentModule = btn.dataset.module;
          currentSection = modules[currentModule].menu[0][0];
          render();
        });
      });
    }

    function renderSidebar(){
      const m = modules[currentModule];
      sideTitle.textContent = m.label;
      sideSubtitle.textContent = m.subtitle;

      if(!m.sections[currentSection]){
        currentSection = m.menu[0][0];
      }

      sideMenu.innerHTML = m.menu.map(([id,label]) =>
        `<button class="${id===currentSection?'active':''}" data-section="${id}">${label}</button>`
      ).join("");

      sideMenu.querySelectorAll("button").forEach(btn=>{
        btn.addEventListener("click",()=>{
          currentSection = btn.dataset.section;
          render();
        });
      });
    }

    function renderHero(){
      const m = modules[currentModule];
      hero.innerHTML = `
        <div class="label">> módulo seleccionado</div>
        <h2>${m.heroTitle}</h2>
        <p>${m.heroText}</p>
        <div class="searchbar">
          <input id="searchInput" type="search" placeholder="Buscar: losa, hormigón, acero, pandeo, deriva, fundación, recubrimiento..." />
          <button id="searchBtn">Buscar</button>
        </div>
        <div class="quick-tools">
          <button type="button" data-module="losas">Losas</button>
          <button type="button" data-module="hormigon">Hormigón/concreto</button>
          <button type="button" data-module="acero">Acero</button>
          <button type="button" data-module="modelado">Validar modelo</button>
          <button type="button" data-module="vocabulario">Vocabulario</button>
          <button type="button" data-module="bibliografia">Bibliografía</button>
        </div>
      `;

      document.getElementById("searchBtn").addEventListener("click", handleSearch);
      document.getElementById("searchInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") handleSearch(); });

      document.querySelectorAll(".quick-tools button").forEach(btn=>{
        btn.addEventListener("click",()=>{
          currentModule = btn.dataset.module;
          currentSection = modules[currentModule].menu[0][0];
          render();
        });
      });
    }

    function renderContent(){
      const m = modules[currentModule];
      content.innerHTML = m.sections[currentSection] || `<div class="section"><h2>Sección no encontrada</h2><p>Seleccioná otra opción del menú.</p></div>`;
    }

    function handleSearch(){
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      if(!q) return;

      const results = [];
      Object.entries(modules).forEach(([mk,m])=>{
        m.menu.forEach(([sid,label])=>{
          const html = m.sections[sid].toLowerCase();
          if(html.includes(q) || label.toLowerCase().includes(q) || m.label.toLowerCase().includes(q)){
            results.push({mk,sid,module:m.label,label});
          }
        });
      });

      if(results.length === 0){
        content.innerHTML = `<div class="section"><h2>Resultado de búsqueda</h2><div class="box warn">No encontré “${q}”. Probá con: losa, pandeo, deriva, hormigón, acero, fundación, recubrimiento o punzonamiento.</div></div>`;
        return;
      }

      content.innerHTML = `
        <div class="section">
          <div class="label">> búsqueda</div>
          <h2>Resultados para “${q}”</h2>
          <div class="grid">
            ${results.slice(0,9).map(r=>`
              <div class="card">
                <h3>${r.module}</h3>
                <p>${r.label}</p>
                <div class="pill-row"><button class="btn gold" onclick="goTo('${r.mk}','${r.sid}')">Abrir</button></div>
              </div>
            `).join("")}
          </div>
        </div>`;
    }

    function goTo(m,s){
      currentModule = m;
      currentSection = s;
      render();
    }

    function calcularLosa(){
      const lx = parseFloat(document.getElementById("lxLosa")?.value || 0);
      const ly = parseFloat(document.getElementById("lyLosa")?.value || 0);
      const tipo = document.getElementById("tipoLosa")?.value || "maciza";
      const out = document.getElementById("resultadoLosa");

      if(!out || !lx || !ly){
        if(out) out.textContent = "Ingresá luces válidas.";
        return;
      }

      const corto = Math.min(lx, ly);
      const largo = Math.max(lx, ly);
      const r = largo / corto;
      const trabajo = r >= 2 ? "una dirección" : "dos direcciones";
      const hMin = tipo === "maciza" ? corto/25 : tipo === "nervada" ? corto/28 : corto/22;
      const hMax = tipo === "maciza" ? corto/20 : tipo === "nervada" ? corto/25 : corto/20;

      out.innerHTML = `
        <strong>Relación largo/corto:</strong> ${r.toFixed(2)} → criterio inicial: <strong>${trabajo}</strong>.<br>
        <strong>Espesor preliminar orientativo:</strong> ${(hMin*100).toFixed(0)} a ${(hMax*100).toFixed(0)} cm.<br>
        <strong>Lectura senior:</strong> verificar cargas, flecha, fisuración, punzonamiento, continuidad, apoyos reales, norma y constructibilidad.
      `;
    }

    function render(){
      renderMainNav();
      renderSidebar();
      renderHero();
      renderContent();
    }

    render();
  </script>
