<!DOCTYPE html>
<html lang="es" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StructuralScope Pro | Prediseño y predimensionamiento estructural</title>

  <style>
    :root{
      --bg:#07111f;
      --bg2:#0b1f33;
      --panel:#101d2f;
      --panel2:#07111f;
      --text:#f8fafc;
      --body:#eef6ff;
      --muted:#c3d0e2;
      --blue:#38bdf8;
      --gold:#d6ad4f;
      --green:#39ff14;
      --red:#fb7185;
      --orange:#f97316;
      --ok:#22c55e;
      --line:rgba(255,255,255,.16);
      --lineBlue:rgba(56,189,248,.38);
      --shadow:0 24px 64px rgba(0,0,0,.38);
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      min-height:100vh;
      overflow-x:hidden;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 9% 10%, rgba(56,189,248,.17), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(214,173,79,.13), transparent 25%),
        linear-gradient(135deg,var(--bg),var(--bg2));
    }

    a{color:inherit;text-decoration:none}

    .topbar{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(7,17,31,.96);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line);
      box-shadow:0 14px 34px rgba(0,0,0,.30);
    }

    .top-inner{
      width:min(1540px,92vw);
      margin:0 auto;
      padding:20px 0 16px;
      display:grid;
      grid-template-columns:1fr auto;
      gap:22px;
      align-items:center;
    }

    .terminal{
      color:var(--green);
      font-family:"Courier New", monospace;
      font-size:15px;
      font-weight:900;
      margin-bottom:8px;
    }

    .brand h1{
      margin:0;
      font-size:clamp(34px,3.2vw,58px);
      line-height:1.02;
      letter-spacing:-1.6px;
    }

    .brand p{
      margin:10px 0 0;
      color:#dbeafe;
      font-size:18px;
      font-weight:800;
    }

    .brand .gold{color:var(--gold)}

    .top-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      padding:10px 15px;
      border-radius:13px;
      border:2px solid var(--blue);
      background:rgba(7,17,31,.38);
      color:var(--text);
      font-weight:900;
      font-size:14px;
      transition:.22s ease;
      cursor:pointer;
    }

    .btn:hover{
      transform:translateY(-2px);
      background:var(--blue);
      color:var(--bg);
      box-shadow:0 12px 25px rgba(56,189,248,.18);
    }

    .btn.gold{
      border-color:var(--gold);
      color:var(--gold);
    }

    .btn.gold:hover{
      background:var(--gold);
      color:var(--bg);
      box-shadow:0 12px 25px rgba(214,173,79,.20);
    }

    .main-nav{
      width:min(1540px,92vw);
      margin:0 auto;
      padding:0 0 18px;
      display:flex;
      gap:10px;
      overflow-x:auto;
    }

    .main-nav button{
      white-space:nowrap;
      border:2px solid var(--lineBlue);
      background:rgba(7,17,31,.45);
      color:var(--text);
      padding:11px 15px;
      min-height:44px;
      border-radius:14px;
      cursor:pointer;
      font-size:14px;
      font-weight:900;
      transition:.22s ease;
    }

    .main-nav button:hover{
      background:var(--blue);
      color:var(--bg);
      transform:translateY(-2px);
    }

    .main-nav button.active{
      border-color:var(--gold);
      background:var(--gold);
      color:var(--bg);
    }

    .layout{
      width:min(1540px,92vw);
      margin:34px auto 54px;
      display:grid;
      grid-template-columns:340px minmax(0,1fr);
      gap:34px;
      align-items:start;
    }

    .sidebar{
      position:sticky;
      top:170px;
      max-height:calc(100vh - 190px);
      overflow:auto;
      background:rgba(16,29,47,.94);
      border:1px solid var(--line);
      border-radius:28px;
      padding:26px;
      box-shadow:var(--shadow);
    }

    .side-title{
      display:flex;
      gap:14px;
      align-items:center;
      border-bottom:1px solid var(--line);
      padding-bottom:18px;
      margin-bottom:18px;
    }

    .dot{
      width:14px;
      height:14px;
      border-radius:50%;
      background:var(--blue);
      box-shadow:0 0 0 6px rgba(56,189,248,.13);
      flex:none;
    }

    .side-title h2{
      margin:0;
      color:var(--blue);
      font-size:22px;
      line-height:1.1;
    }

    .side-title span{
      display:block;
      color:var(--muted);
      margin-top:5px;
      font-size:14px;
      font-weight:800;
    }

    .side-menu{
      display:grid;
      gap:10px;
    }

    .side-menu button{
      width:100%;
      text-align:left;
      border:1px solid rgba(56,189,248,.25);
      background:rgba(7,17,31,.58);
      color:#dbeafe;
      padding:14px;
      border-radius:15px;
      cursor:pointer;
      font-size:15px;
      font-weight:900;
      transition:.22s ease;
    }

    .side-menu button:hover{
      border-color:var(--blue);
      transform:translateX(3px);
    }

    .side-menu button.active{
      color:#ffe8a3;
      background:linear-gradient(90deg,rgba(214,173,79,.27),rgba(56,189,248,.10));
      border-color:rgba(214,173,79,.90);
      box-shadow:inset 6px 0 0 var(--gold), 0 12px 24px rgba(214,173,79,.08);
    }

    .content{
      min-width:0;
    }

    .hero,.section{
      background:rgba(16,29,47,.94);
      border:1px solid var(--line);
      border-radius:28px;
      padding:34px;
      box-shadow:var(--shadow);
      margin-bottom:28px;
    }

    .hero{
      background:
        radial-gradient(circle at top right, rgba(56,189,248,.14), transparent 40%),
        rgba(16,29,47,.94);
    }

    .label{
      color:var(--green);
      font-family:"Courier New", monospace;
      font-weight:900;
      font-size:15px;
      margin-bottom:10px;
    }

    .hero h2{
      margin:0 0 16px;
      color:var(--blue);
      font-size:clamp(34px,3vw,56px);
      line-height:1.08;
      letter-spacing:-1.1px;
      padding-bottom:18px;
      border-bottom:1px solid var(--line);
    }

    .hero p,.section p,.section li{
      color:var(--body);
      font-size:18px;
      line-height:1.62;
      font-weight:750;
    }

    .section h2{
      margin:0 0 18px;
      color:var(--blue);
      font-size:clamp(30px,2.4vw,46px);
      line-height:1.1;
      letter-spacing:-.8px;
      padding-bottom:16px;
      border-bottom:1px solid var(--line);
    }

    .section h3{
      margin:20px 0 10px;
      color:var(--gold);
      font-size:24px;
      line-height:1.15;
    }

    .searchbar{
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      margin-top:24px;
    }

    .searchbar input{
      width:100%;
      min-height:52px;
      border:1px solid var(--lineBlue);
      border-radius:15px;
      background:rgba(7,17,31,.85);
      color:var(--text);
      padding:15px 16px;
      font-size:16px;
      font-weight:800;
      outline:none;
    }

    .searchbar input:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 4px rgba(56,189,248,.13);
    }

    .searchbar button{
      min-height:52px;
      padding:12px 20px;
      border-radius:15px;
      border:2px solid var(--gold);
      background:transparent;
      color:var(--gold);
      font-weight:900;
      cursor:pointer;
      transition:.22s ease;
    }

    .searchbar button:hover{
      background:var(--gold);
      color:var(--bg);
      transform:translateY(-2px);
    }

    .quick-tools{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      border-top:1px solid var(--line);
      margin-top:20px;
      padding-top:20px;
    }

    .quick-tools button{
      border:1px solid rgba(56,189,248,.45);
      background:rgba(56,189,248,.10);
      color:var(--text);
      border-radius:999px;
      padding:10px 13px;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      transition:.22s ease;
    }

    .quick-tools button:hover{
      background:var(--blue);
      color:var(--bg);
      transform:translateY(-2px);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:20px;
      margin-top:22px;
    }

    .grid.two{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .card{
      background:rgba(7,17,31,.62);
      border:1px solid var(--line);
      border-radius:20px;
      padding:24px;
      box-shadow:0 10px 22px rgba(0,0,0,.18);
      transition:.22s ease;
    }

    .card:hover{
      border-color:rgba(56,189,248,.50);
      transform:translateY(-4px);
      box-shadow:0 18px 38px rgba(56,189,248,.10);
    }

    .card h3{
      margin:0 0 10px;
      color:var(--gold);
      font-size:22px;
    }

    .card p{
      margin:0;
      color:#dbeafe;
      font-size:16px;
      line-height:1.55;
    }

    .pill-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:15px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      background:rgba(56,189,248,.13);
      color:var(--text);
      border:1px solid rgba(56,189,248,.42);
      padding:8px 11px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
    }

    .box{
      border-radius:18px;
      padding:18px 20px;
      margin:18px 0;
      font-size:17px;
      font-weight:800;
    }

    .info{
      border:1px solid rgba(56,189,248,.35);
      border-left:6px solid var(--blue);
      background:rgba(56,189,248,.09);
      color:#dbeafe;
    }

    .warn{
      border:1px solid rgba(249,115,22,.38);
      border-left:6px solid var(--orange);
      background:rgba(249,115,22,.09);
      color:#fed7aa;
    }

    .senior{
      border:1px solid rgba(214,173,79,.43);
      background:rgba(214,173,79,.09);
      color:#fff6d8;
    }

    table{
      width:100%;
      border-collapse:collapse;
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      margin:18px 0;
      background:rgba(7,17,31,.62);
    }

    th,td{
      padding:15px;
      border-bottom:1px solid rgba(255,255,255,.09);
      text-align:left;
      vertical-align:top;
      color:#dbeafe;
      font-weight:750;
      font-size:15px;
    }

    th{
      background:rgba(56,189,248,.13);
      color:var(--text);
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.04em;
      font-weight:900;
    }

    tr:last-child td{border-bottom:none}

    td.value{
      color:var(--gold);
      font-weight:900;
      white-space:nowrap;
    }

    details{
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(7,17,31,.62);
      margin:12px 0;
      overflow:hidden;
    }

    summary{
      cursor:pointer;
      padding:16px 18px;
      font-weight:900;
      color:var(--gold);
      background:rgba(56,189,248,.08);
      font-size:16px;
    }

    details[open] summary{
      border-bottom:1px solid var(--line);
      background:rgba(56,189,248,.13);
    }

    .details-body{
      padding:18px;
      color:var(--body);
    }

    .flow{
      display:grid;
      gap:12px;
      margin-top:18px;
    }

    .flow-step{
      display:grid;
      grid-template-columns:56px 1fr;
      gap:16px;
      align-items:center;
      background:rgba(7,17,31,.62);
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
    }

    .num{
      width:48px;
      height:48px;
      border-radius:15px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#004aad,#0b2b61);
      color:white;
      font-weight:900;
      font-size:20px;
      border:1px solid rgba(56,189,248,.35);
    }

    .diagram{
      background:
        radial-gradient(circle at 18% 12%, rgba(56,189,248,.10), transparent 28%),
        rgba(7,17,31,.64);
      border:1px solid rgba(56,189,248,.32);
      border-radius:22px;
      padding:18px;
      margin:18px 0;
      box-shadow:0 14px 30px rgba(0,0,0,.18);
    }

    .diagram-title{
      color:var(--gold);
      font-weight:900;
      font-size:18px;
      margin-bottom:12px;
    }

    .diagram svg{
      width:100%;
      height:auto;
      display:block;
      background:rgba(255,255,255,.03);
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
    }

    .diagram-note{
      color:#cfe5ff;
      font-size:15px;
      font-weight:800;
      margin-top:12px;
    }

    .calc-box{
      background:rgba(7,17,31,.65);
      border:1px solid rgba(214,173,79,.35);
      border-radius:20px;
      padding:20px;
      margin:18px 0;
    }

    .calc-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
    }

    .calc-box label{
      color:#dbeafe;
      font-weight:900;
      font-size:14px;
      display:block;
      margin-bottom:6px;
    }

    .calc-box input,.calc-box select{
      width:100%;
      min-height:46px;
      background:#07111f;
      color:var(--text);
      border:1px solid rgba(56,189,248,.40);
      border-radius:13px;
      padding:10px 12px;
      font-weight:800;
    }

    .calc-box select{
      -webkit-appearance:none;
      -moz-appearance:none;
      appearance:none;
      padding:10px 38px 10px 12px;
      font-size:14px;
      background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%2338bdf8' d='M3.5 5.5l4.5 4.5 4.5-4.5z'/%3E%3C/svg%3E");
      background-repeat:no-repeat;
      background-position:right 12px center;
      background-size:14px;
      text-overflow:ellipsis;
      white-space:nowrap;
      overflow:hidden;
    }

    .calc-box select:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 4px rgba(56,189,248,.13);
      outline:none;
    }

    .calc-result{
      margin-top:16px;
      padding:16px;
      border-radius:16px;
      background:rgba(56,189,248,.10);
      border:1px solid rgba(56,189,248,.32);
      color:#eaf6ff;
      font-weight:800;
    }

    .source-list a{
      color:var(--blue);
      font-weight:900;
    }

    .source-list a:hover{
      color:var(--gold);
      text-decoration:underline;
    }

    .search-results{
      display:none;
    }

    @media(max-width:1180px){
      .top-inner{
        grid-template-columns:1fr;
      }

      .top-actions{
        justify-content:flex-start;
      }

      .layout{
        grid-template-columns:1fr;
        width:min(100% - 32px,1000px);
      }

      .sidebar{
        position:relative;
        top:auto;
        max-height:none;
      }

      .side-menu{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      .grid,.grid.two,.calc-grid{
        grid-template-columns:1fr;
      }

      .searchbar{
        grid-template-columns:1fr;
      }

      .main-nav{
        width:min(100% - 32px,1000px);
      }
    }

    /* ===== EXTENSIONES v2: normativa, calculadoras PRO ===== */
    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:4px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.04em;
      border:1px solid rgba(255,255,255,.2);
    }

    .badge.co{background:rgba(250,204,21,.14);color:#fde68a;border-color:rgba(250,204,21,.4)}
    .badge.ar{background:rgba(56,189,248,.14);color:#bae6fd;border-color:rgba(56,189,248,.4)}

    .table-wrap{
      overflow-x:auto;
      border-radius:18px;
      margin:18px 0;
    }

    .table-wrap table{margin:0}

    .nlink{
      color:var(--blue);
      text-decoration:underline;
      text-decoration-color:rgba(56,189,248,.4);
      text-underline-offset:3px;
      font-weight:900;
      white-space:nowrap;
    }

    .nlink:hover{
      color:var(--gold);
      text-decoration-color:var(--gold);
    }

    .calc-grid.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .calc-grid.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}

    .calc-box .hint{
      color:var(--muted);
      font-size:13px;
      font-weight:700;
      margin-top:4px;
    }

    .calc-box h3{
      margin:0 0 4px;
      color:var(--gold);
      font-size:19px;
    }

    .calc-box .sub{
      color:var(--muted);
      font-size:14px;
      font-weight:700;
      margin:0 0 16px;
    }

    .calc-result strong{color:var(--gold)}
    .calc-result .big{
      display:block;
      font-size:26px;
      color:#bbf7d0;
      font-weight:900;
      margin:6px 0 10px;
    }

    .calc-result.error{
      background:rgba(251,113,133,.10);
      border-color:rgba(251,113,133,.35);
      color:#fecdd3;
    }

    .result-row{
      display:flex;
      justify-content:space-between;
      gap:14px;
      padding:8px 0;
      border-bottom:1px dashed rgba(255,255,255,.10);
      font-size:15px;
    }
    .result-row:last-child{border-bottom:none}
    .result-row span:first-child{color:var(--muted);font-weight:800}
    .result-row span:last-child{color:#fff6d8;font-weight:900}

    .reco-box{
      margin-top:22px;
      padding:22px;
      border-radius:20px;
      border:2px solid var(--gold);
      background:linear-gradient(135deg,rgba(214,173,79,.14),rgba(7,17,31,.75));
    }

    .reco-box .label{margin-bottom:6px}
    .reco-box h3{margin:0 0 10px;color:#ffe8a3;font-size:24px}
    .reco-box p{margin:0 0 6px;color:#fff6d8;font-size:16px;line-height:1.55;font-weight:700}

    .stepper{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:10px;
      margin:18px 0;
    }

    .stepper .s{
      background:rgba(7,17,31,.55);
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px 14px;
      text-align:center;
      font-size:13px;
      font-weight:900;
      color:#dbeafe;
    }

    .stepper .s b{display:block;color:var(--blue);font-size:20px;margin-bottom:2px}

    .norm-filter{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .norm-filter button{
      border:1px solid rgba(56,189,248,.35);
      background:rgba(7,17,31,.5);
      color:#dbeafe;
      padding:8px 13px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
      cursor:pointer;
    }

    .norm-filter button.active{
      background:var(--blue);
      color:var(--bg);
      border-color:var(--blue);
    }

    @media(max-width:900px){
      .calc-grid.cols2,.calc-grid.cols4{grid-template-columns:1fr 1fr}
    }

    @media(max-width:680px){
      .calc-grid.cols2,.calc-grid.cols4{grid-template-columns:1fr}
    }

    @media(max-width:680px){
      .brand h1{font-size:32px}
      .brand p{font-size:16px}

      .hero,.section,.sidebar{
        padding:22px;
        border-radius:22px;
      }

      .side-menu{
        grid-template-columns:1fr;
      }

      .hero h2{font-size:30px}
      .section h2{font-size:28px}

      th,td{
        padding:10px;
        font-size:13px;
      }

      .flow-step{
        grid-template-columns:1fr;
      }

      .btn,.main-nav button{
        font-size:13px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="top-inner">
      <div class="brand">
        <div class="terminal">> guía 04 estructuras... módulo de prediseño cargado</div>
        <h1>StructuralScope Pro</h1>
        <p>Plataforma de <span class="gold">prediseño, predimensionamiento y criterio estructural</span> · Colombia + Argentina</p>
      </div>

      <div class="top-actions">
        <a class="btn gold" href="../">← Volver a Obras Civiles</a>
        <a class="btn" href="../../">Proyectos</a>
        <a class="btn" href="../../../">Portafolio</a>
      </div>
    </div>

                    <tr><td class="value">1 · Pórticos resistentes a momento</td><td>Edificios bajos y medianos; buena flexibilidad arquitectónica.</td><td>Luces, altura entre pisos, derivas, nudos viga-columna.</td></tr>
                    <tr><td class="value">2 · Muros estructurales / placas</td><td>Alta rigidez lateral; edificios medianos y altos.</td><td>Ubicación simétrica, continuidad vertical, aberturas, torsión.</td></tr>
                    <tr><td class="value">3 · Sistema dual (pórticos + muros)</td><td>Uno de los más usados en zonas sísmicas; combina rigidez y flexibilidad.</td><td>Reparto de rigidez, centro de masa y rigidez, derivas, compatibilidad.</td></tr>
                    <tr><td class="value">4 · Viga + losa + columnas</td><td>Típico en vivienda, oficinas y uso general.</td><td>Luces de losa, flechas, punzonamiento, sección de vigas y columnas.</td></tr>
                    <tr><td class="value">5 · Losa plana + columnas</td><td>Espacios limpios; facilita instalaciones y arquitectura.</td><td>Punzonamiento, luces, control de derivas, apoyo en núcleo o muros.</td></tr>
                    <tr><td class="value">6 · Cerchas / pórticos metálicos</td><td>Grandes luces: galpones, naves y cubiertas.</td><td>Luz, arriostramiento, pandeo, uniones.</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="grid">
                <div class="card"><h3>Edificios corrientes</h3><p>Viga-losa-columna o pórticos resistentes a momento.</p></div>
                <div class="card"><h3>Mayor sismo o control de deriva</h3><p>Muros estructurales o sistema dual (pórtico + muro).</p></div>
                <div class="card"><h3>Grandes luces</h3><p>Cerchas o pórticos metálicos.</p></div>
              </div>
            </div>
          `,

          parametros:`
            <div class="section">
              <div class="label">> qué controla el diseño</div>
              <h2>¿Qué parámetro suele gobernar la estructura?</h2>
              <p>En la práctica no siempre controla la resistencia: muchas veces gobiernan la flecha, la deriva, la vibración o la constructibilidad. Identificar qué controla orienta la decisión de prediseño.</p>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Parámetro</th><th>Qué revisar</th><th>Elementos que suele gobernar</th><th>Decisión de prediseño</th></tr></thead>
                  <tbody>
                    <tr><td class="value">Luces</td><td>Distancia entre apoyos, modulación, voladizos.</td><td>Losas, vigas, cerchas.</td><td>Definir sistema adecuado y canto inicial.</td></tr>
                    <tr><td class="value">Flecha</td><td>Relación luz/canto, rigidez, carga de servicio.</td><td>Losas y vigas.</td><td>Aumentar canto/rigidez o reducir luz.</td></tr>
                    <tr><td class="value">Deriva</td><td>Altura total, rigidez lateral, distribución de masa/rigidez.</td><td>Pórticos, muros, sistema dual.</td><td>Incorporar muros/núcleo o aumentar rigidez.</td></tr>
                    <tr><td class="value">Sismo / viento</td><td>Zona sísmica, exposición al viento, regularidad, peso.</td><td>Sistema lateral completo.</td><td>Elegir pórtico, muros o sistema dual.</td></tr>
                    <tr><td class="value">Punzonamiento</td><td>Cargas concentradas, columnas, espesor de losa.</td><td>Losa plana y capiteles.</td><td>Engrosar losa, usar capiteles o vigas.</td></tr>
                    <tr><td class="value">Pandeo / esbeltez</td><td>Longitud libre, arriostramiento, sección.</td><td>Columnas y elementos metálicos comprimidos.</td><td>Aumentar sección o mejorar arriostramiento.</td></tr>
                    <tr><td class="value">Vibración</td><td>Frecuencia natural, uso, masa, rigidez.</td><td>Entrepisos livianos, pasarelas, grandes luces.</td><td>Aumentar rigidez/masa o cambiar sistema.</td></tr>
                    <tr><td class="value">Suelo / asentamientos</td><td>Capacidad portante, nivel freático, deformabilidad.</td><td>Fundaciones y esquema global.</td><td>Ajustar tipo de cimentación y reparto de cargas.</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="box senior"><strong>Lectura rápida:</strong> si manda la luz → revisar canto y sistema · si manda la flecha → aumentar rigidez · si manda la deriva → reforzar el sistema lateral · si manda el suelo → revisar la fundación.</div>
            </div>
          `,
          losas:`
            <div class="section">
              <div class="label">> losas</div>
              <h2>Losas: tipo, criterio y calculadora</h2>
              <p>Como primera lectura: si la luz larga es aproximadamente el doble (o más) de la luz corta, la losa tiende a trabajar en una dirección. Si el paño es más cuadrado, reparte carga en dos direcciones. Pero el tipo final también depende de cargas, instalaciones, altura disponible y constructibilidad.</p>
              ${diagrams.slabs}

              <h3>Tipos de losa y cuándo usar cada una</h3>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Tipo</th><th>Cuándo conviene</th><th>Predimensión inicial</th><th>Control frecuente</th></tr></thead>
                  <tbody>
                    <tr><td class="value">Maciza 1 dirección</td><td>Paños alargados (L≥4.0 m), apoyos en dos bordes o vigas paralelas.</td><td>h ≥ L / 20</td><td>Flecha, fisuración, momento positivo.</td></tr>
                    <tr><td class="value">Maciza 2 direcciones</td><td>Paños con relación largo/corto &lt; 2 (L≤6.0 m), apoyos en 4 lados.</td><td>h ≥ L / 25</td><td>Momentos en ambas direcciones y continuidad.</td></tr>
                    <tr><td class="value">Aligerada (vigueta y bovedilla)</td><td>Luces medias, necesidad de bajar peso propio, montaje rápido.</td><td>h ≥ L/25 y ≥ 20 cm</td><td>Separación de viguetas, capa de compresión, vibración.</td></tr>
                    <tr><td class="value">Nervada / casetonada</td><td>Luces medias-grandes con menor peso propio que la maciza.</td><td>h ≥ L/30 y ≥ 30 cm</td><td>Separación de nervios, capa de compresión, fuego.</td></tr>
                    <tr><td class="value">Losa plana</td><td>Plantas libres, menor altura de piso, estacionamientos u oficinas.</td><td>Mayor espesor; orden de L/28 a L/32.</td><td>Punzonamiento, flecha y transferencia en columnas.</td></tr>
                    <tr><td class="value">Colaborante (steel deck)</td><td>Estructuras metálicas, montaje rápido, entrepisos livianos.</td><td>Según chapa, conectores y fabricante.</td><td>Vibración, fuego, etapa constructiva y conectores.</td></tr>
                  </tbody>
                </table>
              </div>

              <div class="calc-box">
                <h3>Calculadora de espesor preliminar de losa</h3>
                <p class="sub">Aplica las reglas empíricas L/20, L/25, L/30 según tipo. No reemplaza la verificación de flecha y punzonamiento.</p>
                <div class="calc-grid cols4">
                  <div><label>Luz corta Lx (m)</label><input id="lxLosa" type="number" value="4.5" step="0.1"></div>
                  <div><label>Luz larga Ly (m)</label><input id="lyLosa" type="number" value="6.0" step="0.1"></div>
                  <div><label>Tipo de losa</label><select id="tipoLosa">
                    <option value="maciza1">Maciza 1 dirección</option>
                    <option value="maciza2" selected>Maciza 2 direcciones</option>
                    <option value="aligerada">Aligerada (vigueta/bovedilla)</option>
                    <option value="nervada">Nervada / casetonada</option>
                    <option value="plana">Losa plana</option>
                  </select></div>
                  <div><label>Redondeo práctico (cm)</label><select id="redondeoLosa"><option value="1">1 cm</option><option value="5" selected>5 cm</option></select></div>
                </div>
                <button class="btn gold" type="button" onclick="calcularLosa()" style="margin-top:14px;">Calcular espesor</button>
                <div id="resultadoLosa" class="calc-result">Cargá luces y presioná calcular.</div>
              </div>

              <div class="box senior"><strong>Criterio senior:</strong> no te quedes solo con la relación de luces. Revisá continuidad, apoyos reales, rigidez de vigas, huecos, cargas lineales de muros, instalaciones, flecha y proceso constructivo.</div>

              <h3>Detalles y alertas de losa</h3>
              <div class="grid">
                <div class="card"><h3>Huecos</h3><p>Huecos cerca de columnas o apoyos cambian la ruta de carga y pueden exigir refuerzo perimetral.</p></div>
                <div class="card"><h3>Muros sobre losa</h3><p>Los tabiques pesados pueden generar cargas lineales que no estaban en el cálculo inicial.</p></div>
                <div class="card"><h3>Punzonamiento</h3><p>En losas planas y zapatas, el corte alrededor de columnas puede gobernar más que la flexión.</p></div>
              </div>
            </div>
          `,
          vigas:`
            <div class="section">
              <div class="label">> vigas</div>
              <h2>Vigas: tipo, criterio y calculadora</h2>
              <p>La viga recibe reacciones de losas y cargas lineales, y las entrega a columnas o muros. El predimensionamiento parte de relaciones luz/canto; la sección final depende de corte, torsión y compatibilidad con la arquitectura.</p>

              <h3>Tipos de viga y cuándo usar cada una</h3>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Tipo</th><th>Cuándo conviene</th><th>Predimensión inicial</th><th>Nota</th></tr></thead>
                  <tbody>
                    <tr><td class="value">Rectangular (principal)</td><td>Viga sobre línea de columnas; la más común en vivienda y oficinas.</td><td>h = L/10 a L/12 · b = (0.3 a 0.5)·h</td><td>Punto de partida estándar.</td></tr>
                    <tr><td class="value">Rectangular (secundaria)</td><td>Apoya sobre vigas principales; luces menores.</td><td>h = L/12 a L/15 · b = (0.3 a 0.5)·h</td><td>Suele tener menor canto que la principal.</td></tr>
                    <tr><td class="value">Viga de borde</td><td>Perimetral; recibe fachada, antepecho o muro.</td><td>h = L/10 a L/12 · b ≥ 25 cm</td><td>Revisar torsión y cargas de fachada.</td></tr>
                    <tr><td class="value">Viga T (con losa colaborante)</td><td>Losa maciza vaciada monolíticamente con la viga.</td><td>Ala efectiva según norma; alma similar a rectangular.</td><td>Mayor rigidez y capacidad a momento positivo.</td></tr>
                    <tr><td class="value">Viga banda / plana</td><td>Poca altura libre, cielorrasos planos exigidos por arquitectura.</td><td>h reducido, b ampliado (viga "ancha y baja").</td><td>Revisar punzonamiento en el nudo y deflexión.</td></tr>
                    <tr><td class="value">Viga metálica (perfil I/H)</td><td>Luces medias-grandes, montaje rápido, refuerzo en remodelaciones.</td><td>h ≈ L/15 a L/20 (orientativo, perfil comercial).</td><td>Controlar pandeo lateral torsional y conexiones.</td></tr>
                  </tbody>
                </table>
              </div>

              <div class="calc-box">
                <h3>Calculadora de predimensión de viga</h3>
                <p class="sub">Relación luz/canto típica para hormigón armado.</p>
                <div class="calc-grid cols4">
                  <div><label>Luz L (m)</label><input id="lViga" type="number" value="6" min="0.5" step="0.1"></div>
                  <div><label>Tipo de viga</label><select id="tipoViga">
                    <option value="principal" selected>Principal</option>
                    <option value="secundaria">Secundaria</option>
                    <option value="borde">Borde</option>
                  </select></div>
                  <div><label>b/h objetivo</label><select id="relViga"><option value="0.3">0.30 · viga esbelta</option><option value="0.4" selected>0.40 · estándar</option><option value="0.5">0.50 · viga ancha</option></select></div>
                  <div><label>Redondeo práctico (cm)</label><select id="redondeoViga"><option value="1">1 cm</option><option value="5" selected>5 cm</option></select></div>
                </div>
                <button class="btn gold" type="button" onclick="calcularViga()" style="margin-top:14px;">Calcular sección</button>
                <div id="resultadoViga" class="calc-result">Cargá la luz y presioná calcular.</div>
              </div>

              <div class="box warn"><strong>Lo que no calcula esta herramienta:</strong> momento, corte, torsión, deflexión real, cuantía de refuerzo ni anclajes. Esos valores salen del análisis estructural y del diseño por resistencia (Título C / CIRSOC 201).</div>
            </div>
          `,

          columnas:`
            <div class="section">
              <div class="label">> columnas</div>
              <h2>Columnas: tipo, criterio y calculadora</h2>
              <p>La columna baja cargas verticales y momentos hacia la fundación. El predimensionamiento empírico parte de la altura y el número de niveles; para cargas significativas conviene además una estimación rápida por carga axial.</p>

              <h3>Tipos de columna (sección) y cuándo usar cada una</h3>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Tipo</th><th>Cuándo conviene</th><th>Ventaja</th><th>Atención</th></tr></thead>
                  <tbody>
                    <tr><td class="value">Cuadrada</td><td>Pórticos interiores con momento similar en ambas direcciones.</td><td>Misma rigidez en X e Y; formaleta simple.</td><td>Puede ser menos eficiente si hay un eje claramente dominante.</td></tr>
                    <tr><td class="value">Rectangular</td><td>Pórticos perimetrales o con dirección de momento dominante.</td><td>Más eficiente orientando el lado mayor a la flexión principal.</td><td>Verificar la dirección débil igual.</td></tr>
                    <tr><td class="value">Circular</td><td>Estacionamientos, fachadas vistas, alta ductilidad por confinamiento.</td><td>Buen confinamiento con estribos/zunchos; estética.</td><td>Formaleta especial; conexión con vigas rectangulares.</td></tr>
                    <tr><td class="value">En L / en T</td><td>Esquinas o encuentro de muros y pórticos.</td><td>Se adapta a la geometría arquitectónica del borde.</td><td>Centro de rigidez excéntrico: revisar torsión.</td></tr>
                    <tr><td class="value">Metálica (HEB/HEA/tubular)</td><td>Naves industriales, edificios de montaje rápido, refuerzos.</td><td>Alta relación resistencia/peso; rapidez de montaje.</td><td>Pandeo, placa base y anclajes a fundación.</td></tr>
                  </tbody>
                </table>
              </div>

              <h3>Predimensión empírica por niveles</h3>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Altura del edificio</th><th>Relación lado/altura libre</th><th>Lado mínimo práctico</th></tr></thead>
                  <tbody>
                    <tr><td class="value">≤ 3 niveles</td><td>lado ≥ H/20</td><td>25 cm</td></tr>
                    <tr><td class="value">4 a 8 niveles</td><td>lado ≥ H/25</td><td>30 cm</td></tr>
                    <tr><td class="value">&gt; 8 niveles</td><td>lado ≥ H/30</td><td>35 cm</td></tr>
                  </tbody>
                </table>
              </div>

              <div class="calc-box">
                <h3>1 · Predimensión rápida por altura/niveles</h3>
                <div class="calc-grid cols2">
                  <div><label>Altura libre de piso H (m)</label><input id="hColEntrepiso" type="number" value="2.8" step="0.05"></div>
                  <div><label>Niveles totales del edificio</label><input id="nivelesCol" type="number" value="5" min="1" step="1"></div>
                </div>
                <button class="btn gold" type="button" onclick="calcularColumnaNiveles()" style="margin-top:14px;">Calcular lado mínimo</button>
                <div id="resultadoColumnaNiveles" class="calc-result">Cargá los datos y presioná calcular.</div>
              </div>

              <div class="calc-box" style="margin-top:18px;border-color:rgba(56,189,248,.4);">
                <h3>2 · Estimación rápida por carga axial (Ag ≈ Pu / 0.45·f'c)</h3>
                <p class="sub">Regla de prediseño habitual para columnas con carga predominantemente axial. No reemplaza la verificación de interacción P-M-M.</p>
                <div class="calc-grid cols4">
                  <div><label>Área tributaria (m²)</label><input id="areaTribCol" type="number" value="20" step="0.5"></div>
                  <div><label>Niveles que carga</label><input id="nivelesCargaCol" type="number" value="5" min="1" step="1"></div>
                  <div><label>CM (kN/m²)</label><input id="cmCol" type="number" value="5" step="0.5"></div>
                  <div><label>CV (kN/m²)</label><input id="cvCol" type="number" value="2.5" step="0.5"></div>
                  <div><label>f'c (MPa)</label><input id="fcCol" type="number" value="25" step="1"></div>
                  <div><label>Forma de columna</label><select id="formaCol"><option value="cuadrada" selected>Cuadrada</option><option value="circular">Circular</option></select></div>
                </div>
                <button class="btn" type="button" onclick="calcularColumnaCarga()" style="margin-top:14px;">Estimar sección por carga</button>
                <div id="resultadoColumnaCarga" class="calc-result">Cargá los datos y presioná estimar.</div>
              </div>

              <div class="box senior"><strong>Criterio senior:</strong> esbeltez, confinamiento (estribos/zunchos), continuidad de barras entre niveles y compatibilidad con vigas mandan tanto como la sección bruta.</div>
            </div>
          `,
          muros:`
            <div class="section">
              <div class="label">> muros</div>
              <h2>Muros: tipo, criterio y calculadora</h2>
              <p>El muro estructural (de corte o portante) aporta rigidez lateral y/o carga vertical. No todo muro es estructural: distinguir el rol de cada uno evita confiar en elementos que no fueron diseñados para resistir.</p>

              <h3>Tipos de muro y cuándo usar cada uno</h3>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Tipo</th><th>Cuándo conviene</th><th>Rol estructural</th><th>Atención</th></tr></thead>
                  <tbody>
                    <tr><td class="value">Muro de corte / pantalla (hormigón)</td><td>Edificios medianos-altos, núcleos de ascensor/escalera, zonas sísmicas.</td><td>Sistema lateral principal.</td><td>Ubicación simétrica, continuidad vertical, aberturas.</td></tr>
                    <tr><td class="value">Muro portante de mampostería confinada</td><td>Vivienda de baja altura (1 a 2-3 pisos), economía y rapidez.</td><td>Carga vertical + parte de la carga lateral.</td><td>Confinamiento perimetral, densidad de muros por dirección.</td></tr>
                    <tr><td class="value">Muro de contención</td><td>Sótanos, taludes, desniveles, muros perimetrales bajo nivel de terreno.</td><td>Resiste empuje de tierras y agua.</td><td>Drenaje, impermeabilización, estabilidad al volcamiento/deslizamiento.</td></tr>
                    <tr><td class="value">Tabique / muro divisorio no estructural</td><td>Solo cerramiento o división de espacios.</td><td>Ninguno (no debería tomar carga).</td><td>Vincular con holgura o junta para no generar carga accidental sobre la estructura.</td></tr>
                  </tbody>
                </table>
              </div>

              <div class="calc-box">
                <h3>Calculadora de espesor mínimo de muro de corte</h3>
                <div class="calc-grid cols2">
                  <div><label>Altura libre de piso H (m)</label><input id="hMuro" type="number" value="2.8" step="0.05"></div>
                  <div><label>Longitud del muro en planta (m, opcional)</label><input id="lMuroPlanta" type="number" value="3" step="0.1"></div>
                </div>
                <button class="btn gold" type="button" onclick="calcularMuro()" style="margin-top:14px;">Calcular espesor</button>
                <div id="resultadoMuro" class="calc-result">Cargá la altura y presioná calcular.</div>
              </div>

              <div class="box senior"><strong>Regla práctica:</strong> espesor t ≥ H/25 y t ≥ 15 cm · longitud mínima l ≥ 4t · relación H/t ≤ 30 a 35. Revisar siempre torsión accidental, excentricidades y aberturas grandes.</div>
            </div>
          `,

          zapatas:`
            <div class="section">
              <div class="label">> fundaciones</div>
              <h2>Zapatas y fundaciones: tipo, criterio y calculadora</h2>
              <p>La fundación une la superestructura con el suelo. La elección depende de la carga, la capacidad portante, los asentamientos admisibles, el nivel freático, medianeras y el costo de excavación.</p>
              ${diagrams.zapata}

              <h3>Tipos de cimentación y cuándo usar cada una</h3>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Tipo</th><th>Cuándo conviene</th><th>Predimensión inicial</th></tr></thead>
                  <tbody>
                    <tr><td class="value">Zapata aislada</td><td>Columnas separadas, cargas moderadas, buen suelo superficial.</td><td>A ≥ P/qadm · h ≥ (0.25 a 0.35)·B</td></tr>
                    <tr><td class="value">Zapata combinada</td><td>Columnas muy próximas o sobre medianera (no entra zapata aislada simétrica).</td><td>Repartir presión uniforme entre ambas columnas.</td></tr>
                    <tr><td class="value">Zapata corrida</td><td>Muros portantes o línea de columnas cercanas.</td><td>B ≥ 0.6 a 0.8 · espesor del muro · h ≥ (0.25 a 0.35)·B</td></tr>
                    <tr><td class="value">Losa / platea de cimentación</td><td>Suelos blandos, cargas distribuidas, necesidad de controlar asentamientos diferenciales.</td><td>h ≥ (0.20 a 0.30) · menor dimensión</td></tr>
                    <tr><td class="value">Pilotes / pozos profundos</td><td>Mal suelo superficial, cargas altas o estrato resistente profundo.</td><td>Según capacidad por fuste + punta (estudio geotécnico).</td></tr>
                  </tbody>
                </table>
              </div>

              <div class="calc-box">
                <h3>1 · Zapata aislada</h3>
                <div class="calc-grid cols4">
                  <div><label>Carga de servicio P (kN)</label><input id="pZapata" type="number" value="800" step="10"></div>
                  <div><label>q admisible del suelo (kPa)</label><input id="qZapata" type="number" value="150" step="10"></div>
                  <div><label>Lado de columna/pedestal (cm, opcional)</label><input id="colZapata" type="number" value="35" step="1"></div>
                  <div><label>Redondeo práctico (cm)</label><select id="redondeoZapata"><option value="5">5 cm</option><option value="10" selected>10 cm</option></select></div>
                </div>
                <button class="btn gold" type="button" onclick="calcularZapataAislada()" style="margin-top:14px;">Calcular zapata aislada</button>
                <div id="resultadoZapataAislada" class="calc-result">Cargá los datos y presioná calcular.</div>
              </div>

              <div class="calc-box" style="margin-top:18px;border-color:rgba(56,189,248,.4);">
                <h3>2 · Zapata corrida</h3>
                <div class="calc-grid cols4">
                  <div><label>Carga lineal de servicio w (kN/m)</label><input id="wZapataCorrida" type="number" value="120" step="5"></div>
                  <div><label>q admisible del suelo (kPa)</label><input id="qZapataCorrida" type="number" value="150" step="10"></div>
                  <div><label>Espesor del muro (cm, opcional)</label><input id="muroZapataCorrida" type="number" value="20" step="1"></div>

    let currentModule = "inicio";

        currentSection = m.menu[0][0];

    function renderContent(){

      content.innerHTML = m.sections[currentSection] || `<div class="section"><h2>Sección no encontrada</h2><p>Seleccioná otra opción del menú.</p></div>`;

    function handleSearch(){
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      if(!q) return;

      const results = [];
      Object.entries(modules).forEach(([mk,m])=>{
        m.menu.forEach(([sid,label])=>{
          const html = m.sections[sid].toLowerCase();
          if(html.includes(q) || label.toLowerCase().includes(q) || m.label.toLowerCase().includes(q)){
            results.push({mk,sid,module:m.label,label});
          }
        });
      });

      if(results.length === 0){
        content.innerHTML = `<div class="section"><h2>Resultado de búsqueda</h2><div class="box warn">No encontré “${q}”. Probá con: losa, viga, columna, muro, zapata, sistema resistente, pandeo, deriva, hormigón, acero, fundación o normativa.</div></div>`;
        return;

    /* ============ HELPERS DE CÁLCULO ============ */
    function fmt(n,d=2){ return isFinite(n) ? n.toFixed(d) : "—"; }
    function roundUp(value, step){ return Math.ceil(value/step)*step; }
    function showError(elId, msg){
      const out = document.getElementById(elId);
      if(out){ out.className = "calc-result error"; out.innerHTML = `<strong>⚠ ${msg}</strong>`; }
    }
    function rangeWarning(value, max, msg){
      return value > max ? `<div class="box warn" style="margin-top:8px;"><strong>⚠ Verificar datos:</strong> ${msg}</div>` : "";
    }

    /* ============ SELECTOR DE SISTEMA RESISTENTE ============ */
    function evaluarSistema(){
      const niveles = parseFloat(document.getElementById("sisNiveles")?.value) || 1;
      const demanda = document.getElementById("sisDemanda")?.value || "media";
      const luz = parseFloat(document.getElementById("sisLuz")?.value) || 5;
      const prioridad = document.getElementById("sisPrioridad")?.value || "flex";
      const out = document.getElementById("resultadoSistema");
      if(!out) return;

      const prioridadTxt = {flex:"flexibilidad arquitectónica", rigidez:"rigidez lateral / control de deriva", economia:"economía y repetición", luces:"grandes luces libres"}[prioridad];
      const demandaTxt = {baja:"baja", media:"media", alta:"alta"}[demanda];

      let sistema, motivo, control;

      if(luz >= 15 || prioridad === "luces"){
        sistema = "Cerchas / pórticos metálicos para grandes luces";
        motivo = `Con una luz típica de ${fmt(luz,1)} m, un sistema viga-losa-columna en hormigón deja de ser eficiente. Las cerchas o pórticos metálicos cubren grandes claros con menor peso propio y montaje más rápido.`;
        control = "luz, arriostramiento, pandeo y diseño de uniones.";
      } else if(niveles <= 3 && demanda !== "alta"){
        sistema = "Pórticos resistentes a momento (viga + losa + columnas)";
        motivo = `Para ${niveles} nivel(es) y demanda sísmica ${demandaTxt}, los pórticos ofrecen buena flexibilidad arquitectónica sin necesitar muros estructurales.`;
        control = "derivas, nudos viga-columna y luces de losa.";
      } else if(niveles > 8 || demanda === "alta"){
        if(prioridad === "flex"){
          sistema = "Sistema dual (pórticos + muros)";
          motivo = `Edificio de ${niveles} niveles con demanda sísmica ${demandaTxt}: el sistema dual combina la rigidez de los muros con la flexibilidad de los pórticos, sin sacrificar tanto espacio en planta.`;
        } else {
          sistema = "Muros estructurales / placas";
          motivo = `Edificio de ${niveles} niveles con demanda sísmica ${demandaTxt}: priorizar rigidez lateral con muros o núcleos suele controlar mejor la deriva que un sistema solo de pórticos.`;
        }
        control = "ubicación simétrica, continuidad vertical, aberturas y torsión.";
      } else {
        sistema = "Sistema dual (pórticos + muros)";
        motivo = `Para ${niveles} niveles y demanda ${demandaTxt}, el sistema dual es uno de los más usados en zonas sísmicas: reparte rigidez entre pórticos y muros.`;
        control = "reparto de rigidez, centro de masa y de rigidez, derivas.";
      }

      out.innerHTML = `
        <div class="reco-box">
          <div class="label">> recomendación</div>
          <h3>${sistema}</h3>
          <p>${motivo}</p>
          <p><strong>Prioridad declarada:</strong> ${prioridadTxt}.</p>
          <p><strong>Parámetros a controlar:</strong> ${control}</p>
          <p style="margin-top:14px;font-size:14px;opacity:.85;">Para el sistema gravitacional (no sismorresistente) podés además evaluar <strong>losa plana + columnas</strong> si buscás plantas libres con pocas vigas.</p>
        </div>`;
    }

    /* ============ LOSAS ============ */
    function calcularLosa(){
      const lx = parseFloat(document.getElementById("lxLosa")?.value);
      const ly = parseFloat(document.getElementById("lyLosa")?.value);
      const tipo = document.getElementById("tipoLosa")?.value || "maciza2";
      const redondeo = parseFloat(document.getElementById("redondeoLosa")?.value) || 5;
      const out = document.getElementById("resultadoLosa");
      if(!out) return;

      if(!lx || !ly || lx<=0 || ly<=0){ showError("resultadoLosa","Ingresá luces válidas (mayores a 0)."); return; }

      const corto = Math.min(lx,ly);
      const largo = Math.max(lx,ly);
      const r = largo/corto;
      const trabajo = r >= 2 ? "una dirección" : "dos direcciones";

      const tipos = {
        maciza1:{nombre:"Maciza 1 dirección", base:corto, div:20, min:0.10, cond:`Válida con L ≥ 4.0 m (luz de trabajo = ${fmt(corto,2)} m).`, alerta: corto<4.0?"La luz de trabajo es menor a 4.0 m: la regla L/20 es conservadora; el mínimo normativo absoluto ronda 10 cm.":null},
        maciza2:{nombre:"Maciza 2 direcciones", base:corto, div:25, min:0.10, cond:`Recomendada con L ≤ 6.0 m (luz larga = ${fmt(largo,2)} m).`, alerta: largo>6.0?"La luz larga supera 6.0 m: verificar con tabla extendida (ACI 318 / NSR-10 / CIRSOC 201) o pasar a losa nervada/plana.":null},
        aligerada:{nombre:"Aligerada (vigueta y bovedilla)", base:corto, div:25, min:0.20, cond:"h ≥ L/25 y ≥ 20 cm.", alerta:null},
        nervada:{nombre:"Nervada / casetonada", base:corto, div:30, min:0.30, cond:"h ≥ L/30 y ≥ 30 cm.", alerta:null},
        plana:{nombre:"Losa plana", base:corto, div:30, min:0.15, cond:"Orden de L/28 a L/32; el punzonamiento suele gobernar antes que la flexión.", alerta:"Losa plana: revisar SIEMPRE punzonamiento alrededor de columnas; puede requerir capiteles o ábacos."}
      };

      const t = tipos[tipo];
      let hCalc = Math.max(t.base / t.div, t.min);
      let hCm = roundUp(hCalc*100, redondeo);

      out.className = "calc-result";
      out.innerHTML = `
        <div class="result-row"><span>Relación largo/corto</span><span>${fmt(r,2)} → trabajo en ${trabajo}</span></div>
        <div class="result-row"><span>Tipo evaluado</span><span>${t.nombre}</span></div>
        <div class="result-row"><span>Condición de la regla</span><span>${t.cond}</span></div>
        <span class="big">h preliminar ≈ ${hCm} cm</span>
        ${t.alerta ? `<div class="box warn" style="margin:10px 0 0;">${t.alerta}</div>` : ""}
        ${rangeWarning(hCm, 60, `${hCm} cm es un espesor de losa inusualmente alto. Revisá las luces ingresadas (¿unidades en metros?) o considerá otro sistema (nervada/losa plana con capiteles).`)}
        <div class="hint">Lectura senior: verificar cargas, flecha, fisuración, punzonamiento, continuidad, apoyos reales, norma y constructibilidad antes de fijar el espesor definitivo.</div>
      `;
    }

    /* ============ VIGAS ============ */
    function calcularViga(){
      const L = parseFloat(document.getElementById("lViga")?.value);
      const tipo = document.getElementById("tipoViga")?.value || "principal";
      const rel = parseFloat(document.getElementById("relViga")?.value) || 0.4;
      const redondeo = parseFloat(document.getElementById("redondeoViga")?.value) || 5;
      const out = document.getElementById("resultadoViga");
      if(!out) return;
      if(!L || L<=0){ showError("resultadoViga","Ingresá una luz válida (mayor a 0)."); return; }

      let hMinM, hMaxM, bMinAbs = null;
      if(tipo === "principal"){ hMinM = L/12; hMaxM = L/10; }
      else if(tipo === "secundaria"){ hMinM = L/15; hMaxM = L/12; }
      else { hMinM = L/12; hMaxM = L/10; bMinAbs = 0.25; }

      const hProm = (hMinM+hMaxM)/2;
      const hMinCm = roundUp(hMinM*100, redondeo);
      const hMaxCm = roundUp(hMaxM*100, redondeo);
      let bCm = roundUp(rel*hProm*100, redondeo);
      if(bMinAbs && bCm < bMinAbs*100) bCm = roundUp(bMinAbs*100, redondeo);

      const tipoTxt = {principal:"Viga principal", secundaria:"Viga secundaria", borde:"Viga de borde"}[tipo];

      out.className = "calc-result";
      out.innerHTML = `
        <div class="result-row"><span>Tipo</span><span>${tipoTxt} · L = ${fmt(L,2)} m</span></div>
        <div class="result-row"><span>Canto h (regla L/10 a L/15)</span><span>${hMinCm} – ${hMaxCm} cm</span></div>
        <span class="big">h sugerido ≈ ${hMaxCm} cm · b sugerido ≈ ${bCm} cm</span>
        ${bMinAbs ? `<div class="hint">Viga de borde: ancho mínimo recomendado ${(bMinAbs*100).toFixed(0)} cm por cargas de fachada y torsión.</div>` : ""}
        ${rangeWarning(hMaxCm, 150, `${hMaxCm} cm de canto es muy alto para una viga de hormigón armado. Con luces grandes (&gt;12-14 m) conviene evaluar acero estructural o un sistema de cerchas/pórticos metálicos.`)}
        <div class="hint">Esto NO calcula momento, corte, torsión, flecha real ni cuantía de refuerzo — son resultados del análisis y el diseño por resistencia.</div>
      `;
    }

    /* ============ COLUMNAS ============ */
    function calcularColumnaNiveles(){
      const H = parseFloat(document.getElementById("hColEntrepiso")?.value);
      const niveles = parseFloat(document.getElementById("nivelesCol")?.value);
      const out = document.getElementById("resultadoColumnaNiveles");
      if(!out) return;
      if(!H || H<=0 || !niveles || niveles<=0){ showError("resultadoColumnaNiveles","Ingresá altura y número de niveles válidos."); return; }

      let rel, ladoMinPractico, rango;
      if(niveles<=3){ rel=1/20; ladoMinPractico=25; rango="≤ 3 niveles"; }
      else if(niveles<=8){ rel=1/25; ladoMinPractico=30; rango="4 a 8 niveles"; }
      else { rel=1/30; ladoMinPractico=35; rango="> 8 niveles"; }

      const ladoPorEsbeltez = H*rel*100;
      const ladoFinal = Math.max(ladoPorEsbeltez, ladoMinPractico);
      const ladoRedondeado = roundUp(ladoFinal,5);

      out.className = "calc-result";
      out.innerHTML = `
        <div class="result-row"><span>Categoría por altura</span><span>${rango}</span></div>
        <div class="result-row"><span>Relación lado/altura libre</span><span>≥ H/${Math.round(1/rel)}</span></div>
        <div class="result-row"><span>Lado mínimo práctico (tabla)</span><span>${ladoMinPractico} cm</span></div>
        <span class="big">Lado de columna ≈ ${ladoRedondeado} cm</span>
        ${rangeWarning(ladoRedondeado, 150, `${ladoRedondeado} cm es una sección muy grande para predimensionamiento empírico. Revisá la altura libre ingresada (¿está en metros?) o evaluá acero estructural.`)}
        <div class="hint">Verificar siempre esbeltez (KL/r), confinamiento y continuidad de barras entre niveles.</div>
      `;
    }

    function calcularColumnaCarga(){
      const areaTrib = parseFloat(document.getElementById("areaTribCol")?.value);
      const niveles = parseFloat(document.getElementById("nivelesCargaCol")?.value);
      const cm = parseFloat(document.getElementById("cmCol")?.value);
      const cv = parseFloat(document.getElementById("cvCol")?.value);
      const fc = parseFloat(document.getElementById("fcCol")?.value);
      const forma = document.getElementById("formaCol")?.value || "cuadrada";
      const out = document.getElementById("resultadoColumnaCarga");
      if(!out) return;
      if(!areaTrib || !niveles || !cm || !cv || !fc || areaTrib<=0 || niveles<=0 || fc<=0){
        showError("resultadoColumnaCarga","Completá todos los campos con valores mayores a 0."); return;
      }

      // Carga última aproximada (combinación 1.2D+1.6L) por nivel, acumulada
      const cargaServicioPorNivel = areaTrib * (cm + cv); // kN
      const PuTotal = niveles * areaTrib * (1.2*cm + 1.6*cv); // kN, estimación

      // Ag requerida (mm²): Ag = Pu(N) / (0.45 * f'c (MPa = N/mm²))  — regla de prediseño usual
      const PuN = PuTotal*1000;
      const AgMm2 = PuN / (0.45*fc);
      const AgCm2 = AgMm2/100;

      let resultadoSeccion;
      let ladoEquivalente;
      if(forma === "cuadrada"){
        const lado = Math.sqrt(AgCm2);
        const ladoRedondeado = roundUp(Math.max(lado,20),5);
        resultadoSeccion = `Columna cuadrada ≈ ${ladoRedondeado} × ${ladoRedondeado} cm`;
        ladoEquivalente = ladoRedondeado;
      } else {
        const diam = 2*Math.sqrt(AgCm2/Math.PI);
        const diamRedondeado = roundUp(Math.max(diam,25),5);
        resultadoSeccion = `Columna circular ≈ Ø ${diamRedondeado} cm`;
        ladoEquivalente = diamRedondeado;
      }

      out.className = "calc-result";
      out.innerHTML = `
        <div class="result-row"><span>Carga de servicio acumulada (aprox.)</span><span>${fmt(cargaServicioPorNivel*niveles,0)} kN</span></div>
        <div class="result-row"><span>Carga última Pu estimada (1.2D+1.6L)</span><span>${fmt(PuTotal,0)} kN</span></div>
        <div class="result-row"><span>Área bruta requerida (Ag ≈ Pu/0.45f'c)</span><span>${fmt(AgCm2,0)} cm²</span></div>
        <span class="big">${resultadoSeccion}</span>
        ${rangeWarning(ladoEquivalente, 150, `La sección resultante (${ladoEquivalente} cm) es muy grande. Revisá el área tributaria, las cargas CM/CV y el número de niveles ingresados.`)}
        <div class="box warn" style="margin-top:8px;">Estimación preliminar por carga predominantemente axial. No reemplaza la verificación de interacción P-M-M, esbeltez ni el área tributaria real del proyecto.</div>
      `;
    }

    /* ============ MUROS ============ */
    function calcularMuro(){
      const H = parseFloat(document.getElementById("hMuro")?.value);
      const lPlanta = parseFloat(document.getElementById("lMuroPlanta")?.value);
      const out = document.getElementById("resultadoMuro");
      if(!out) return;
      if(!H || H<=0){ showError("resultadoMuro","Ingresá una altura válida (mayor a 0)."); return; }

      const tCm = Math.max(H*100/25, 15);
      const tRedondeado = roundUp(tCm,5);
      const lMinM = 4*(tRedondeado/100);
      const relHt = (H*100/tRedondeado);

      out.className = "calc-result";
      out.innerHTML = `
        <div class="result-row"><span>Espesor mínimo (t ≥ H/25 y ≥ 15 cm)</span><span>${tRedondeado} cm</span></div>
        <div class="result-row"><span>Longitud mínima del muro (l ≥ 4t)</span><span>${fmt(lMinM,2)} m</span></div>
        <div class="result-row"><span>Relación H/t</span><span>${fmt(relHt,1)} ${relHt<=35?"✓ dentro de 30–35":"⚠ revisar, supera 35"}</span></div>
        ${ lPlanta ? `<div class="result-row"><span>Longitud en planta declarada</span><span>${fmt(lPlanta,2)} m ${lPlanta>=lMinM?"✓ cumple":"⚠ menor a la mínima"}</span></div>` : ""}
        <span class="big">t recomendado ≈ ${tRedondeado} cm</span>
        ${rangeWarning(tRedondeado, 100, `${tRedondeado} cm de espesor es inusual para un muro de corte. Revisá la altura ingresada (¿está en metros?).`)}
        <div class="hint">Revisar torsión accidental, excentricidades, aberturas y conexión con diafragmas de losa.</div>
      `;
    }

    /* ============ ZAPATAS / FUNDACIONES ============ */
    function calcularZapataAislada(){
      const P = parseFloat(document.getElementById("pZapata")?.value);
      const q = parseFloat(document.getElementById("qZapata")?.value);
      const colCm = parseFloat(document.getElementById("colZapata")?.value);
      const redondeo = parseFloat(document.getElementById("redondeoZapata")?.value) || 10;
      const out = document.getElementById("resultadoZapataAislada");
      if(!out) return;
      if(!P || !q || P<=0 || q<=0){ showError("resultadoZapataAislada","Ingresá carga y capacidad portante válidas (mayores a 0)."); return; }

      const A = P/q; // m2
      const B = Math.sqrt(A); // m, zapata cuadrada
      const Bcm = roundUp(B*100, redondeo);
      const hMinM = 0.25*(Bcm/100);
      const hMaxM = 0.35*(Bcm/100);
      const hCmMin = roundUp(hMinM*100,5);
      const hCmMax = roundUp(hMaxM*100,5);

      let voladoTxt = "";
      if(colCm && colCm>0){
        const volado = (Bcm-colCm)/2;
        voladoTxt = `<div class="result-row"><span>Volado (cada lado)</span><span>${fmt(volado,0)} cm ${volado>=15?"✓ ≥ 15-20 cm":"⚠ revisar, parece corto"}</span></div>`;
      }

      out.className = "calc-result";
      out.innerHTML = `
        <div class="result-row"><span>Área requerida (A = P/qadm)</span><span>${fmt(A,2)} m²</span></div>
        <div class="result-row"><span>Lado de zapata cuadrada (B = √A)</span><span>${Bcm} cm</span></div>
        ${voladoTxt}
        <div class="result-row"><span>Espesor h ≈ (0.25–0.35)·B</span><span>${hCmMin} – ${hCmMax} cm</span></div>
        <span class="big">Zapata ≈ ${Bcm} × ${Bcm} cm · h ≈ ${hCmMax} cm</span>
        ${rangeWarning(Bcm, 600, `${(Bcm/100).toFixed(1)} m de lado es una zapata aislada muy grande. Revisá unidades: P en kN, qadm en kPa. Con esta magnitud convendría evaluar una losa de cimentación o pilotes.`)}
        <div class="hint">Profundidad de desplante mínima recomendada: 0.80 m (sujeta a estudio geotécnico). Verificar punzonamiento y FS de la capacidad portante usada.</div>
      `;
    }

    function calcularZapataCorrida(){
      const w = parseFloat(document.getElementById("wZapataCorrida")?.value);
      const q = parseFloat(document.getElementById("qZapataCorrida")?.value);
      const muroCm = parseFloat(document.getElementById("muroZapataCorrida")?.value);
      const redondeo = parseFloat(document.getElementById("redondeoZapataCorrida")?.value) || 5;
      const out = document.getElementById("resultadoZapataCorrida");
      if(!out) return;
      if(!w || !q || w<=0 || q<=0){ showError("resultadoZapataCorrida","Ingresá carga lineal y capacidad portante válidas (mayores a 0)."); return; }

      const Bm = w/q; // m por metro lineal
      let BcmCalc = roundUp(Bm*100, redondeo);

      if(muroCm && muroCm>0){
        const Bmin = roundUp(0.7*muroCm, redondeo); // 0.6 a 0.8, tomar promedio 0.7 de referencia práctica
        if(Bmin > BcmCalc) BcmCalc = Bmin;
      }

      const hMin = roundUp(0.25*BcmCalc,5);
      const hMax = roundUp(0.35*BcmCalc,5);

      out.className = "calc-result";
      out.innerHTML = `
        <div class="result-row"><span>Ancho requerido (B = w/qadm)</span><span>${BcmCalc} cm</span></div>
        <div class="result-row"><span>Espesor h ≈ (0.25–0.35)·B</span><span>${hMin} – ${hMax} cm</span></div>
        <span class="big">Zapata corrida ≈ ${BcmCalc} cm de ancho · h ≈ ${hMax} cm</span>
        ${rangeWarning(BcmCalc, 300, `${(BcmCalc/100).toFixed(1)} m de ancho es inusual para una zapata corrida. Revisá unidades: w en kN/m, qadm en kPa. Con esta magnitud convendría evaluar una losa de cimentación.`)}
        <div class="hint">Profundidad de desplante mínima recomendada: 0.80 m. En suelos blandos o cargas muy distribuidas, comparar contra una losa de cimentación.</div>
      `;
    }

    /* ============ FILTRO TABLA NORMATIVA ============ */
    function filtrarNormativa(cat, btn){
      document.querySelectorAll("#normFilter button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll("#tablaNormativa tbody tr").forEach(tr=>{
        tr.style.display = (cat === "all" || tr.dataset.cat === cat) ? "" : "none";
      });
    }

    function render(){
      renderMainNav();
      renderSidebar();
      renderHero();
      renderContent();
    }

    render();
  </script>
</body>
